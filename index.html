<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caiçara Play</title>
<meta name="theme-color" content="#0080c0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;height:100dvh;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:30;padding:10px 12px;display:flex;gap:14px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);align-items:center}
.top button{border:none;background:none;color:#aaa;font-weight:700;font-size:15px}.top button.active{color:#fff;border-bottom:2px solid #fff}
.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100dvh;width:100vw;scroll-snap-align:start;position:relative;background:#111;overflow:hidden}
.card video,.card img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.tapArea{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center}
.pauseIcon{font-size:70px;opacity:0;transition:0.2s;pointer-events:none}
.pauseIcon.show{opacity:1}
.side{position:absolute;right:8px;bottom:120px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:20}
.side button{width:52px;height:52px;border-radius:50%;border:none;background:rgba(255,255,255,.25);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.info{position:absolute;left:12px;right:80px;bottom:90px;z-index:15;pointer-events:none}
.followBtn{pointer-events:auto;background:#fff;color:#000;border:none;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900;margin-left:6px}
.followBtn.following{background:#222;color:#fff;border:1px solid #555}
.bottom{position:fixed;bottom:0;left:0;right:0;height:72px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom button{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;font-size:11px;opacity:.7;flex:1}.bottom button.active{opacity:1}
.plus{width:52px;height:34px;background:#fff;color:#000;border-radius:10px;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}.modal.show{display:flex}
.loginBg{position:fixed;inset:0;background:linear-gradient(180deg,#001a2a,#000);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.loginBox{background:#151515;border:1px solid #222;border-radius:20px;padding:20px;width:100%;max-width:380px}
.loginBox input,.loginBox select{width:100%;background:#000;border:1px solid #333;color:#fff;padding:14px;border-radius:12px;margin-top:10px;font-size:15px}
.loginBox button{width:100%;background:#0080c0;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;margin-top:14px;font-size:16px}
.loginBox button:disabled{background:#333;color:#666}
.musicBadge{position:absolute;left:12px;bottom:155px;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:20px;font-size:11px;z-index:15}
#installBanner{position:fixed;bottom:82px;left:10px;right:10px;background:#0080c0;color:#fff;padding:14px;border-radius:14px;z-index:150;display:none;justify-content:space-between;align-items:center;font-weight:800}#installBanner.show{display:flex}
.grid{padding:70px 2px 80px 2px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;overflow-y:auto;height:100dvh}
#fileGaleria,#fileFoto{display:none}
.filters{display:flex;gap:10px;padding:10px;overflow-x:auto;background:#0a0a0a;border-top:1px solid #222}.f{flex:0 0 60px;text-align:center}.f div{width:60px;height:60px;border-radius:12px;background:#222;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid transparent}.f.active div{border-color:#0080c0}
.songs{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#111;border-top:1px solid #222}.song{flex:0 0 110px;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:8px}.song.active{border-color:#0080c0;background:#001a2a}
</style>
</head>
<body>

<!-- CADASTRO COMPLETO -->
<div id="loginScreen" class="loginBg" style="display:none">
<div style="font-size:60px">🌊</div>
<h1 style="margin:8px 0 2px">Caiçara Play</h1>
<p style="opacity:.7;font-size:13px;margin-bottom:12px">Pra entrar precisa ser maior de 18 anos</p>
<div class="loginBox">
<label style="font-size:11px;opacity:.6">NOME COMPLETO</label>
<input id="inpNome" placeholder="Ex: João Silva">
<label style="font-size:11px;opacity:.6">NOME DE USUÁRIO</label>
<input id="inpUser" placeholder="@ Ex: @joao_caiçara">
<label style="font-size:11px;opacity:.6">SEU ZAP</label>
<input id="inpZap" type="tel" placeholder="(12) 9 9999-9999" maxlength="15" oninput="maskZap(this)">
<label style="font-size:11px;opacity:.6">CIDADE</label>
<select id="inpCity"><option>Caraguatatuba</option><option>Ubatuba</option><option>São Sebastião</option><option>Ilhabela</option><option>Paraty</option></select>
<label style="font-size:11px;opacity:.6">DATA DE NASCIMENTO</label>
<input id="inpNasc" type="date" style="color-scheme:dark">
<div style="margin-top:10px;display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="checkMaior" style="width:18px;height:18px;margin-top:2px"><label for="checkMaior" style="font-size:12px;opacity:.8">Confirmo que tenho 18 anos ou mais e aceito os termos do Caiçara Play. <b>Menor de 18 não pode se cadastrar.</b></label></div>
<div id="msgErro" style="color:#ff4444;font-size:12px;margin-top:8px;display:none"></div>
<button id="btnCadastrar" onclick="fazerCadastro()">Criar minha conta 🚀</button>
<p style="font-size:10px;opacity:.4;margin-top:10px;text-align:center">Seus dados (zap) ficam salvos só no seu celular. Usamos pra validar conta.</p>
</div>
</div>

<input type="file" id="fileGaleria" accept="video/*"><input type="file" id="fileFoto" accept="image/*">
<div class="top"><button style="background:#ff2d55;color:#fff;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:900;border:none">🔴 LIVE</button><button class="active" onclick="showFeed()">Para você</button><button onclick="showGrade()">Galeria</button><span style="margin-left:auto;font-size:11px;opacity:.8" id="meLabel"></span></div>
<div class="feed" id="feed"></div><div class="grid" id="grid" style="display:none"></div>
<div id="installBanner"><span>📲 Instalar Caiçara Play?</span><button onclick="instalar()" style="background:#fff;color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:900">Instalar</button></div>
<div class="bottom"><button class="active" onclick="showFeed()">⌂<br>Início</button><button onclick="alert('Em breve')">👥<br>Seguindo</button><button onclick="abrirEscolha()" style="opacity:1"><div class="plus">+</div></button><button onclick="showGrade()">💬<br>Mensagens</button><button onclick="sair()">👤<br>Perfil</button></div>

<div class="modal" id="escolha" style="background:rgba(0,0,0,.85);justify-content:flex-end;padding:16px"><div style="background:#1e1e1e;border-radius:16px"><button onclick="abrirGaleria()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700;border-bottom:1px solid #333">📁 Vídeo da Galeria</button><button onclick="abrirFoto()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700;border-bottom:1px solid #333">🖼️ Foto com música</button><button onclick="abrirCamera()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700">📷 Gravar</button><button onclick="document.getElementById('escolha').classList.remove('show')" style="width:100%;background:none;border:none;color:#999;padding:14px">Cancelar</button></div></div>
<div class="modal" id="editor"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:#000;border-bottom:1px solid #222"><button onclick="fecharEditor()" style="background:none;border:none;color:#fff;font-size:22px">✕</button><b id="editTitle">Editar</b><button id="btnPost" style="background:#0080c0;border:none;color:#fff;padding:8px 16px;border-radius:20px;font-weight:900">Postar</button></div><div style="flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden"><video id="prevVideo" loop playsinline></video><img id="prevFoto" style="display:none"><video id="camVideo" autoplay muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none"></video><div style="position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:12px"><button id="btnRec" style="width:68px;height:68px;border-radius:50%;background:#ff2d55;border:4px solid #fff" onclick="toggleRec()"></button><div id="timer" style="font-weight:900;font-size:11px;background:rgba(0,0,0,.7);padding:6px 10px;border-radius:20px">00:00 / 10:00</div></div></div><div class="filters" id="filters"></div><div class="songs" id="songs"></div><div style="padding:10px;background:#000;display:flex;gap:8px"><input id="leg" placeholder="Legenda..." style="flex:1;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:10px"><select id="city" style="background:#111;color:#fff;border:1px solid #333;border-radius:10px;padding:8px"><option>Caraguá</option><option>Ubatuba</option></select></div></div>

<script>
const DB_NAME='caicara_v23';let db;
function openDB(){return new Promise(r=>{const o=indexedDB.open(DB_NAME,2);o.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true}); if(!e.target.result.objectStoreNames.contains('follows')) e.target.result.createObjectStore('follows',{keyPath:'user'})};o.onsuccess=e=>{db=e.target.result;r();}});}
function addVideo(v){return new Promise(r=>{const tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(v).onsuccess=r;});}
function getVideos(){return new Promise(r=>{const tx=db.transaction('videos','readonly');tx.objectStore('videos').getAll().onsuccess=e=>r(e.target.result.reverse());});}
function isFollowing(user){return new Promise(r=>{const tx=db.transaction('follows','readonly');tx.objectStore('follows').get(user).onsuccess=e=>r(!!e.target.result);});}
function toggleFollowDB(user){return new Promise(r=>{const tx=db.transaction('follows','readwrite');const s=tx.objectStore('follows');s.get(user).onsuccess=e=>{if(e.target.result) s.delete(user).onsuccess=()=>r(false); else s.add({user}).onsuccess=()=>r(true);}});}}

function maskZap(i){let v=i.value.replace(/\D/g,'');v=v.replace(/^(\d{2})(\d)/g,'($1) $2');v=v.replace(/(\d{5})(\d)/,'$1-$2');i.value=v;}

function calcIdade(data){
const hoje=new Date(); const nasc=new Date(data);
let idade=hoje.getFullYear()-nasc.getFullYear();
const m=hoje.getMonth()-nasc.getMonth();
if(m<0 || (m===0 && hoje.getDate()<nasc.getDate())) idade--;
return idade;
}

function checarLogin(){
const u=localStorage.getItem('caicara_user');
if(!u){document.getElementById('loginScreen').style.display='flex';}else{
const d=JSON.parse(u);document.getElementById('meLabel').innerText=d.usuario;document.getElementById('loginScreen').style.display='none';
}
}
function fazerCadastro(){
const nome=document.getElementById('inpNome').value.trim();
let user=document.getElementById('inpUser').value.trim();
const zap=document.getElementById('inpZap').value.trim();
const city=document.getElementById('inpCity').value;
const nasc=document.getElementById('inpNasc').value;
const check=document.getElementById('checkMaior').checked;
const msg=document.getElementById('msgErro');
msg.style.display='none';

if(nome.length<3){msg.innerText='Digite seu nome completo';msg.style.display='block';return;}
if(user.length<3){msg.innerText='Digite seu @usuário';msg.style.display='block';return;}
if(!user.startsWith('@')) user='@'+user;
if(zap.replace(/\D/g,'').length<10){msg.innerText='Digite seu Zap válido com DDD';msg.style.display='block';return;}
if(!nasc){msg.innerText='Selecione sua data de nascimento';msg.style.display='block';return;}
const idade=calcIdade(nasc);
if(idade<18){msg.innerText='🚫 Você precisa ter 18 anos ou mais. Menor de 18 não pode fazer cadastro no Caiçara Play.';msg.style.display='block';return;}
if(!check){msg.innerText='Marque que tem 18+ para continuar';msg.style.display='block';return;}

localStorage.setItem('caicara_user',JSON.stringify({nome,usuario:user,zap,city,nasc,idade}));
checarLogin();
}
function sair(){if(confirm('Sair?')){localStorage.removeItem('caicara_user');checarLogin();}}

let tempBlob=null,tempFoto=null,filterCSS='none',stream=null,recorder=null,chunks=[],recTimer=null,recSec=0,isRecording=false,deferredPrompt=null,selectedSong='none',songAudio=null,customSongUrl=null,customSongName='';
const filtros=[{id:'none',nome:'Normal',css:'none'},{id:'bw',nome:'P&B',css:'grayscale(1)'},{id:'sepia',nome:'Retrô',css:'sepia(1)'},{id:'vivid',nome:'Vivid',css:'saturate(2)'}];
const musicas=[{id:'none',nome:'Sem música',artista:'Original',url:''},{id:'mar',nome:'Mar Calmo',artista:'Lo-fi',url:'https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3'},{id:'custom',nome:'📁 Minha Música',artista:'Top',url:''}];

function hideAll(){document.getElementById('feed').style.display='none';document.getElementById('grid').style.display='none';document.querySelectorAll('#feed video, #feed audio').forEach(v=>v.pause());}
function showFeed(){if(!localStorage.getItem('caicara_user')){checarLogin();return;}hideAll();document.getElementById('feed').style.display='block';render();}
function showGrade(){hideAll();document.getElementById('grid').style.display='grid';render();}
async function curtir(btn,id){if(!localStorage.getItem('caicara_user')){checarLogin();return;}const tx=db.transaction('videos','readwrite');const s=tx.objectStore('videos');const r=s.get(id);r.onsuccess=()=>{const v=r.result;v.liked=!v.liked;v.likes=v.liked?(v.likes||0)+1:Math.max(0,(v.likes||1)-1);s.put(v);btn.innerText=v.liked?'❤️':'🤍';btn.nextElementSibling.innerText=v.likes;};}
async function seguir(btn,user){if(!localStorage.getItem('caicara_user')){checarLogin();return;}const now=await toggleFollowDB(user);btn.innerText=now?'Seguindo':'Seguir';btn.className=now?'followBtn following':'followBtn';}
async function sharePost(t){const d={title:'Caiçara Play 🌊',text:t,url:location.href};if(navigator.share){try{await navigator.share(d);return;}catch(e){}}try{await navigator.clipboard.writeText(location.href);alert('Link copiado!');}catch(e){alert(location.href);}}
function togglePlay(card){const v=card.querySelector('video');const ic=card.querySelector('.pauseIcon');if(v){if(v.paused){v.play();ic.classList.remove('show');}else{v.pause();ic.innerText='⏸️';ic.classList.add('show');setTimeout(()=>ic.classList.remove('show'),800);}}}
function abrirEscolha(){document.getElementById('escolha').classList.add('show');}
function abrirGaleria(){document.getElementById('escolha').classList.remove('show');document.getElementById('fileGaleria').click();}
function abrirFoto(){document.getElementById('escolha').classList.remove('show');document.getElementById('fileFoto').click();}
async function abrirCamera(){document.getElementById('escolha').classList.remove('show');document.getElementById('editor').classList.add('show');document.getElementById('camVideo').style.display='block';try{if(stream) stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});document.getElementById('camVideo').srcObject=stream;recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};recorder.onstop=()=>{tempBlob=new Blob(chunks,{type:'video/webm'});document.getElementById('prevVideo').src=URL.createObjectURL(tempBlob);document.getElementById('prevVideo').style.display='block';document.getElementById('camVideo').style.display='none';document.getElementById('prevVideo').play();montar();};}catch{alert('Libera câmera');}}
function toggleRec(){if(!recorder){abrirCamera();return;}if(!isRecording){chunks=[];recSec=0;isRecording=true;recorder.start(100);recTimer=setInterval(()=>{recSec++;document.getElementById('timer').innerText=String(Math.floor(recSec/60)).padStart(2,'0')+':'+String(recSec%60).padStart(2,'0')+' / 10:00';if(recSec>=600) toggleRec();},1000);}else{isRecording=false;recorder.stop();clearInterval(recTimer);}}
document.getElementById('fileGaleria').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;tempBlob=f;tempFoto=null;document.getElementById('prevVideo').src=URL.createObjectURL(f);document.getElementById('prevVideo').style.display='block';document.getElementById('camVideo').style.display='none';document.getElementById('prevVideo').play();document.getElementById('editor').classList.add('show');montar();});
document.getElementById('fileFoto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{tempFoto=ev.target.result;document.getElementById('prevFoto').src=tempFoto;document.getElementById('prevFoto').style.display='block';document.getElementById('prevVideo').style.display='none';document.getElementById('editor').classList.add('show');montar();};r.readAsDataURL(f);});
function montar(){document.getElementById('filters').innerHTML=filtros.map(f=>`<div class="f ${f.css===filterCSS?'active':''}" onclick="setF('${f.id}')"><div style="filter:${f.css}">${f.nome}</div></div>`).join('');document.getElementById('songs').innerHTML=musicas.map(m=>`<div class="song ${selectedSong===m.id?'active':''}" onclick="setSong('${m.id}')"><b>${m.nome}</b><span>${m.artista}</span></div>`).join('');}
function setF(id){const f=filtros.find(x=>x.id===id);filterCSS=f.css;document.getElementById('prevVideo').style.filter=f.css;document.getElementById('prevFoto').style.filter=f.css;document.getElementById('camVideo').style.filter=f.css;document.querySelectorAll('.f').forEach((el,i)=>el.classList.toggle('active',filtros[i].id===id));}
function setSong(id){selectedSong=id;document.querySelectorAll('.song').forEach((el,i)=>el.classList.toggle('active',musicas[i].id===id));if(songAudio){songAudio.pause();songAudio=null;} if(id==='custom'){const inp=document.createElement('input');inp.type='file';inp.accept='audio/*';inp.onchange=e=>{const file=e.target.files[0];if(!file) return;customSongName=file.name;customSongUrl=URL.createObjectURL(file);songAudio=new Audio(customSongUrl);songAudio.loop=true;songAudio.play();};inp.click();return;} const m=musicas.find(x=>x.id===id);if(m.url){songAudio=new Audio(m.url);songAudio.loop=true;songAudio.play();}}
function fecharEditor(){document.getElementById('editor').classList.remove('show');document.getElementById('camVideo').style.display='none';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}if(recorder&&recorder.state!=='inactive') recorder.stop();clearInterval(recTimer);isRecording=false;if(songAudio){songAudio.pause();}}
function setupObserver(){const opt={root:document.getElementById('feed'),threshold:0.6};const obs=new IntersectionObserver(es=>{es.forEach(en=>{const v=en.target.querySelector('video');if(en.isIntersecting){document.querySelectorAll('#feed video').forEach(x=>{if(x!==v) x.pause();});if(v){v.muted=false;v.play().catch(()=>{});} }else{if(v) v.pause();}});},opt);document.querySelectorAll('.card').forEach(c=>obs.observe(c));}
async function render(){const vids=await getVideos();const feed=document.getElementById('feed');const grid=document.getElementById('grid');if(!vids.length){feed.innerHTML=`<div class="card" style="display:flex;align-items:center;justify-content:center;flex-direction:column"><p style="font-size:50px">🌊</p><p style="font-weight:900">Caiçara Play</p><button onclick="abrirEscolha()" style="margin-top:16px;background:#0080c0;color:#fff;border:none;padding:12px 24px;border-radius:20px;font-weight:900">+ Postar</button></div>`;return;}feed.innerHTML=await Promise.all(vids.map(async v=>{const isFoto=v.type==='foto';const media=isFoto?`<img src="${v.fotoData}" style="filter:${v.filter||'none'}">`:`<video loop playsinline src="${URL.createObjectURL(v.blob)}" style="filter:${v.filter||'none'}" muted></video>`;const following=await isFollowing(v.user);return `<div class="card" onclick="togglePlay(this)"><div class="tapArea"><div class="pauseIcon">▶️</div></div>${media}<div class="side" onclick="event.stopPropagation()"><div style="display:flex;flex-direction:column;align-items:center"><button onclick="curtir(this,${v.id})">${v.liked?'❤️':'🤍'}</button><span style="font-size:11px">${v.likes||0}</span></div><button onclick="sharePost('${(v.desc||'').replace(/'/g,'')}')">↗️</button></div><div class="info"><div style="display:flex;align-items:center;gap:6px"><b>${v.user}</b><button class="followBtn ${following?'following':''}" onclick="event.stopPropagation();seguir(this,'${v.user}')">${following?'Seguindo':'Seguir'}</button></div><div style="font-size:13px">${v.desc}</div></div></div>`;}));feed.innerHTML=(await Promise.all(vids.map(async v=>{const isFoto=v.type==='foto';const media=isFoto?`<img src="${v.fotoData}" style="filter:${v.filter||'none'}">`:`<video loop playsinline src="${URL.createObjectURL(v.blob)}" style="filter:${v.filter||'none'}" muted></video>`;const following=await isFollowing(v.user);return `<div class="card" onclick="togglePlay(this)"><div class="tapArea"><div class="pauseIcon">▶️</div></div>${media}<div class="side" onclick="event.stopPropagation()"><div style="display:flex;flex-direction:column;align-items:center"><button onclick="curtir(this,${v.id})">${v.liked?'❤️':'🤍'}</button><span style="font-size:11px">${v.likes||0}</span></div><button onclick="sharePost('${(v.desc||'').replace(/'/g,'')}')">↗️</button></div><div class="info"><div style="display:flex;align-items:center;gap:6px"><b>${v.user}</b><button class="followBtn ${following?'following':''}" onclick="event.stopPropagation();seguir(this,'${v.user}')">${following?'Seguindo':'Seguir'}</button></div><div style="font-size:13px">${v.desc}</div></div></div>`;}))).join('');grid.innerHTML=vids.map(v=>v.type==='foto'?`<img src="${v.fotoData}">`:`<video src="${URL.createObjectURL(v.blob)}" muted loop></video>`).join('');setTimeout(setupObserver,300);}

openDB().then(()=>{checarLogin();render();});
