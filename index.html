<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caiçara Play - A rede do Litoral</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#000;color:#fff;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:20;padding:14px 16px;display:flex;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent)}
.logo{font-weight:900;font-size:22px}.logo b{color:#fb923c}
.chips{position:fixed;top:50px;left:0;right:0;z-index:20;display:flex;gap:8px;padding:8px 12px;overflow-x:auto}
.chips::-webkit-scrollbar{display:none}
.chip{background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700}
.chip.active{background:#fff;color:#000}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.feed::-webkit-scrollbar{display:none}
.card{height:100vh;width:100vw;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
.card video{width:100%;height:100%;object-fit:cover}
.info{position:absolute;bottom:100px;left:12px;right:80px;z-index:5}
.user{font-weight:800;font-size:16px;margin-bottom:6px;text-shadow:0 1px 8px #000}
.user span{background:#fb923c;color:#000;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px}
.desc{font-size:14px;text-shadow:0 1px 8px #000}
.side{position:absolute;right:10px;bottom:110px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:5}
.b{width:56px;height:56px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;border:none;color:#fff}
.b.liked{background:rgba(255,50,50,.4)}
.side p{font-size:12px;font-weight:800;margin-top:4px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:74px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:20}
.bottom button{background:none;border:none;color:#fff;font-size:26px;opacity:.6}
.bottom button.active{opacity:1}
.plus{width:54px;height:36px;background:#fff;color:#000;border-radius:10px;font-weight:900;font-size:28px;opacity:1!important}
#file{ display:none }
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.box{background:#18181b;width:100%;max-width:360px;border-radius:16px;padding:20px}
.box input,.box textarea{width:100%;background:#27272a;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin-top:10px}
.box button{width:100%;background:#fb923c;color:#000;border:none;padding:14px;border-radius:10px;font-weight:900;margin-top:14px}
</style>
</head>
<body>
<input type="file" id="file" accept="video/*">
<div class="top"><div class="logo">CAIÇARA <b>PLAY</b></div><div onclick="alert('Busca em breve!')">🔍</div></div>
<div class="chips" id="chips"></div>
<div class="feed" id="feed"></div>
<div class="bottom"><button class="active">⌂</button><button onclick="alert('Explorar vem aí')">◎</button><button class="plus" onclick="document.getElementById('file').click()">+</button><button onclick="alert('DM em breve')">✉</button><button onclick="alert('Seu perfil')">👤</button></div>

<div class="modal" id="modal"><div class="box"><h3>Novo rolê caiçara 🔥</h3><input id="mUser" placeholder="@seu_user"><input id="mLocal" placeholder="Local: Caraguá / Ubatuba / etc"><textarea id="mDesc" placeholder="Legenda..."></textarea><button onclick="salvarNovo()">Publicar no Caiçara Play</button><button style="background:#333;color:#fff" onclick="fecharModal()">Cancelar</button></div></div>

<script>
const cidades=["Todos","Caraguá","Ubatuba","São Seba","Ilhabela","Músicos 🎤"];
let filtro="Todos";
let novoVideoBlob=null;

let videos=JSON.parse(localStorage.getItem('caicara_videos')||'null') || [
{user:"@moraes_vozao",local:"Caraguá",desc:"Sambinha na Martim de Sá hoje! Quem colou? 🎤🌊 #caiçara",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",likes:1200,com:89},
{user:"@acai_top_caragua",local:"Caraguá",desc:"COPÃO QUE O LITORAL AMA! Comenta EU QUERO 😱",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",likes:3400,com:212},
{user:"@surf_ubata",local:"Ubatuba",desc:"Hoje na Praia Brava 1,5m liso! Quem bora? 🏄‍♂️",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",likes:892,com:34}
];

function renderChips(){
 document.getElementById('chips').innerHTML=cidades.map(c=>`<button class="chip ${c===filtro?'active':''}" onclick="setFiltro('${c}')">${c}</button>`).join('');
}
function setFiltro(c){filtro=c;renderChips();renderFeed();}

function renderFeed(){
 const f=document.getElementById('feed');
 const lista=filtro==="Todos"?videos:videos.filter(v=>v.local.includes(filtro)||v.desc.includes(filtro));
 f.innerHTML=lista.map((v,i)=>`
 <div class="card">
 <video loop playsinline muted onclick="this.paused?this.play():this.pause()" src="${v.src}"></video>
 <div class="info"><div class="user">${v.user}<span>${v.local}</span></div><div class="desc">${v.desc}</div></div>
 <div class="side">
 <div><button class="b ${v.liked?'liked':''}" onclick="like(${i})">${v.liked?'❤️':'🤍'}</button><p>${v.likes}</p></div>
 <div><button class="b" onclick="comentar()">💬</button><p>${v.com}</p></div>
 <div><button class="b" onclick="zap('${v.user}')">🔗</button><p>Whats</p></div>
 </div>
 </div>`).join('');
 observar();
}
function observar(){
 const vs=document.querySelectorAll('video');
 const o=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)e.target.play().catch(()=>{});else e.target.pause();})},{threshold:0.6});
 vs.forEach(x=>o.observe(x));
}
function like(i){
 const lista=filtro==="Todos"?videos:videos.filter(v=>v.local.includes(filtro));
 const realIndex=videos.indexOf(lista[i]);
 videos[realIndex].liked=!videos[realIndex].liked;
 videos[realIndex].likes+=videos[realIndex].liked?1:-1;
 localStorage.setItem('caicara_videos',JSON.stringify(videos));
 renderFeed();
}
function comentar(){ const c=prompt('Comenta aí:'); if(c) alert('Comentário enviado! (em breve vai aparecer)'); }
function zap(user){ const num=prompt('Whats do '+user+' (com DDD):','129...'); if(num) window.open('https://wa.me/55'+num.replace(/\D/g,''),'_blank'); }

document.getElementById('file').addEventListener('change',e=>{
 const file=e.target.files[0]; if(!file) return;
 novoVideoBlob=URL.createObjectURL(file);
 document.getElementById('modal').classList.add('show');
});
function fecharModal(){document.getElementById('modal').classList.remove('show');}
function salvarNovo(){
 const u=document.getElementById('mUser').value||"@voce";
 const l=document.getElementById('mLocal').value||"Caraguá";
 const d=document.getElementById('mDesc').value||"Novo vídeo no Caiçara Play 🌊";
 videos.unshift({user:u,local:l,desc:d,src:novoVideoBlob,likes:0,com:0});
 localStorage.setItem('caicara_videos',JSON.stringify(videos));
 fecharModal(); renderFeed(); alert('Publicado! Já tá no seu feed.');
}
renderChips();renderFeed();
</script>
</body>
</html>
