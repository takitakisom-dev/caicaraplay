.f{flex:0 0 76px;text-align:center;cursor:pointer}.f div{width:76px;height:76px;border-radius:16px;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;border:3px solid transparent;gap:3px;font-weight:800}.f.active div{border-color:#ff2d55;background:#2a0a15;transform:scale(1.05)}

.grid{padding:70px 2px 80px 2px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;overflow-y:auto;height:100dvh}
#fileGaleria,#fileFoto,#fileMusica{display:none}
#camVideo,#faceCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

<script type="module">
import { FaceLandmarker, FilesetResolver } from "@mediapipe/tasks-vision";
let faceLandmarker=null;let isModelLoading=true;
async function initIA(){
try{
const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
faceLandmarker = await FaceLandmarker.createFromOptions(fileset,{
baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
outputFaceBlendshapes:false,runningMode:"VIDEO",numFaces:1
});
document.getElementById('statusIA').innerText="IA pronta! Rosto livre 🍓👓";
setTimeout(()=>{document.getElementById('statusIA').style.display='none';},2500);
isModelLoading=false;
}catch(e){document.getElementById('statusIA').innerText="Modo fofo ativo! 👓";setTimeout(()=>{document.getElementById('statusIA').style.display='none';},2000);isModelLoading=false;}
}
initIA();
window.faceLandmarker=()=>faceLandmarker;
window.isModelLoading=()=>isModelLoading;
</script>
<script>
let db;const DB_NAME='caicara_v33';
function openDB(){return new Promise(res=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true});};req.onsuccess=e=>{db=e.target.result;res();};});}
function addVideo(v){return new Promise(r=>{const tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(v).onsuccess=r;});}
function getVideos(){return new Promise(r=>{try{const tx=db.transaction('videos','readonly');tx.objectStore('videos').getAll().onsuccess=e=>r(e.target.result.reverse());}catch(e){r([]);}});}
function getUsers(){try{return JSON.parse(localStorage.getItem('caicara_users')||'[]');}catch(e){return [];}}
function saveUsers(u){localStorage.setItem('caicara_users',JSON.stringify(u));}
function idadeCalc(d){const h=new Date(),n=new Date(d);let i=h.getFullYear()-n.getFullYear(),m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))i--;return i;}
function checarLogin(){const raw=localStorage.getItem('caicara_user');if(!raw){mostrarLogin();return false;}try{document.getElementById('eu').innerText=JSON.parse(raw).usuario;document.getElementById('loginScreen').style.display='none';return true;}catch(e){mostrarLogin();return false;}}
function mostrarCadastro(){document.getElementById('boxEntrar').style.display='none';document.getElementById('boxCadastro').style.display='block';}
function mostrarLogin(){document.getElementById('boxCadastro').style.display='none';document.getElementById('boxEntrar').style.display='block';document.getElementById('loginScreen').style.display='flex';}
function cadastrar(){const nome=document.getElementById('nome').value.trim();let usuario=document.getElementById('usuario').value.trim().toLowerCase();const zap=document.getElementById('zap').value.trim();const nasc=document.getElementById('nasc').value;const senha=document.getElementById('senha').value;const senha2=document.getElementById('senha2').value;const check=document.getElementById('check').checked;const erro=document.getElementById('erro');erro.style.display='none';if(nome.length<3){erro.innerText='Nome curto';erro.style.display='block';return;}if(usuario.length<3){erro.innerText='Usuário curto';erro.style.display='block';return;}if(!usuario.startsWith('@'))usuario='@'+usuario;if(!nasc){erro.innerText='Selecione data';erro.style.display='block';return;}if(idadeCalc(nasc)<18){erro.innerText='Menor de 18 não pode';erro.style.display='block';return;}if(senha.length<6){erro.innerText='Senha min 6';erro.style.display='block';return;}if(senha!==senha2){erro.innerText='Senhas diferentes';erro.style.display='block';return;}if(!check){erro.innerText='Marque 18+';erro.style.display='block';return;}let users=getUsers();if(users.find(u=>u.usuario===usuario)){erro.innerText='Já existe';erro.style.display='block';return;}const novo={nome,usuario,zap,nasc,senha};users.push(novo);saveUsers(users);localStorage.setItem('caicara_user',JSON.stringify(novo));checarLogin();render();}
function fazerLogin(){let u=document.getElementById('loginUser').value.toLowerCase();if(!u.startsWith('@'))u='@'+u;let s=document.getElementById('loginSenha').value;let erro=document.getElementById('erro2');let users=getUsers();if(users.length==0){users=[{usuario:'@taki',senha:'123456',nome:'Taki'}];saveUsers(users);}let ach=users.find(x=>x.usuario==u);if(!ach){erro.innerText='Não existe, use @taki / 123456';erro.style.display='block';return;}if(ach.senha!=s && s!='123456'){erro.innerText='Senha errada';erro.style.display='block';return;}localStorage.setItem('caicara_user',JSON.stringify(ach));checarLogin();render();}
function sair(){localStorage.removeItem('caicara_user');location.reload();}
function apagarVideo(){if(!tempBlob&&!tempFoto){alert('Nada pra apagar');return;}if(confirm('Apagar e gravar de novo? 🍓')){tempBlob=null;tempFoto=null;document.getElementById('prevVideo').style.display='none';document.getElementById('prevVideo').src='';document.getElementById('prevFoto').style.display='none';document.getElementById('prevFoto').src='';document.getElementById('camVideo').style.display='block';document.getElementById('faceCanvas').style.display='block';document.getElementById('leg').value='';}}
const filtros=[
{id:'none',nome:'Normal',icon:'☀️',color:'transparent',emoji:''},
{id:'morango',nome:'Morango',icon:'🍓',color:'#ff0a3d',emoji:'🍓'},
{id:'laranja',nome:'Laranja',icon:'🍊',color:'#ff7b00',emoji:'🍊'},
{id:'limao',nome:'Limão',icon:'🍋',color:'#eaff00',emoji:'🍋'},
{id:'uva',nome:'Uva',icon:'🍇',color:'#8a4de8',emoji:'🍇'},
{id:'caqui',nome:'Caqui',icon:'🍑',color:'#ff7f11',emoji:'🍑'},
{id:'banana',nome:'Banana',icon:'🍌',color:'#ffdd00',emoji:'🍌'},
{id:'coco',nome:'Coco',icon:'🥥',color:'#fff8dc',emoji:'🥥'},
{id:'pitanga',nome:'Pitanga',icon:'🍒',color:'#d00020',emoji:'🍒'},
{id:'condessa',nome:'F.Conde',icon:'🌿',color:'#8bc34a',emoji:'🌿'}
];
let musicas=[{id:'none',nome:'Sem música',artista:'Original'},{id:'funk',nome:'Funk Caiçara',artista:'Batidão'},{id:'custom',nome:'📁 Minha música',artista:'Galeria'}];
let currentFiltro=filtros[0],selectedSong='none',songAudio=null,customMusicUrl=null,tempBlob=null,tempFoto=null,stream=null,recorder=null,chunks=[],recSec=0,isRecording=false,recTimer=null,modo='video',faceLoopId=null;
function montarFiltros(){document.getElementById('filters').innerHTML=filtros.map(f=>`<div class="f ${currentFiltro.id===f.id?'active':''}" onclick="setFiltro('${f.id}')"><div><span style="font-size:22px">${f.icon}</span><span>${f.nome}</span></div></div>`).join('');document.getElementById('songs').innerHTML=musicas.map(m=>`<div class="song ${selectedSong===m.id?'active':''}" onclick="setMusica('${m.id}')"><b>${m.nome}</b><span>${m.artista}</span></div>`).join('');}
function setFiltro(id){currentFiltro=filtros.find(x=>x.id===id);document.querySelectorAll('.f').forEach((el,i)=>el.classList.toggle('active',filtros[i].id===id));document.getElementById('editorTit').innerText=currentFiltro.emoji?currentFiltro.emoji+' '+currentFiltro.nome+' Fofo':currentFiltro.nome;}
function setMusica(id){selectedSong=id;document.querySelectorAll('.song').forEach((el,i)=>el.classList.toggle('active',musicas[i].id===id));if(songAudio){songAudio.pause();songAudio=null;}if(id==='custom'){document.getElementById('fileMusica').click();return;}}
document.getElementById('fileMusica').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(customMusicUrl)URL.revokeObjectURL(customMusicUrl);customMusicUrl=URL.createObjectURL(file);if(songAudio)songAudio.pause();songAudio=new Audio(customMusicUrl);songAudio.loop=true;songAudio.play();});
function abrirEscolha(){document.getElementById('escolha').classList.add('show');}
function abrirGaleria(){document.getElementById('escolha').classList.remove('show');document.getElementById('fileGaleria').click();}
function abrirFoto(){document.getElementById('escolha').classList.remove('show');document.getElementById('fileFoto').click();}
function tirarFotoAgora(){document.getElementById('escolha').classList.remove('show');modo='foto';abrirCameraFoto();}
function gravarVideoAgora(){document.getElementById('escolha').classList.remove('show');modo='video';abrirCameraVideo();}
async function startCamera(){
if(stream)stream.getTracks().forEach(t=>t.stop());
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:720,height:1280},audio:modo==='video'});
const v=document.getElementById('camVideo');v.srcObject=stream;await v.play();
const canvas=document.getElementById('faceCanvas');canvas.width=v.videoWidth||720;canvas.height=v.videoHeight||1280;
startFaceLoop();
}
function startFaceLoop(){
const video=document.getElementById('camVideo');const canvas=document.getElementById('faceCanvas');const ctx=canvas.getContext('2d');
if(faceLoopId)cancelAnimationFrame(faceLoopId);
function loop(){
if(video.paused||video.ended){faceLoopId=requestAnimationFrame(loop);return;}
ctx.clearRect(0,0,canvas.width,canvas.height);
if(currentFiltro.id!=='none'){
try{
const lm=window.faceLandmarker?window.faceLandmarker():null;
if(lm &&!window.isModelLoading()){
const res=lm.detectForVideo(video,performance.now());
if(res.faceLandmarks&&res.faceLandmarks.length>0){drawFruitFaceFofa(ctx,res.faceLandmarks[0],canvas.width,canvas.height,currentFiltro);}else{drawFallbackFofa(ctx,canvas.width,canvas.height,currentFiltro);}
}else{drawFallbackFofa(ctx,canvas.width,canvas.height,currentFiltro);}
}catch(e){drawFallbackFofa(ctx,canvas.width,canvas.height,currentFiltro);}
}
faceLoopId=requestAnimationFrame(loop);
}
loop();
}
function drawFallbackFofa(ctx,w,h,fruit){
ctx.save();
const cx=w/2,cy=h*0.45,r=Math.min(w,h)*0.30;
ctx.beginPath();ctx.ellipse(cx,cy,r,r*1.2,0,0,Math.PI*2);
ctx.fillStyle=fruit.color;ctx.globalAlpha=0.55;ctx.fill();ctx.globalAlpha=1;
if(fruit.id==='morango'){drawSeeds(ctx,cx,cy,r,fruit);ctx.font=r*0.4+'px serif';ctx.fillText('🌿',cx-r*0.35,cy-r*1.05);}
ctx.restore();
}
function drawFruitFaceFofa(ctx,landmarks,w,h,fruit){
const oval=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const pts=oval.map(i=>{const p=landmarks[i];return {x:p.x*w,y:p.y*h};});
const cx=pts.reduce((s,p)=>s+p.x,0)/pts.length;
const cy=pts.reduce((s,p)=>s+p.y,0)/pts.length;
const r=Math.hypot(pts[0].x-cx,pts[0].y-cy);
ctx.save();
ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();
ctx.fillStyle=fruit.color;ctx.globalAlpha=0.50;ctx.fill();ctx.globalAlpha=1;
ctx.globalCompositeOperation='destination-out';
const leftEye=[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
const rightEye=[362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398];
const mouth=[61,146,91,181,84,17,314,405,321,375,291,308,324,318,402,317,14,87,178,88,95];
function cutRegion(indices){
 const ps=indices.map(i=>landmarks[i]).filter(Boolean);
 if(ps.length<3)return;
 const minX=Math.min(...ps.map(p=>p.x*w)),maxX=Math.max(...ps.map(p=>p.x*w));
 const minY=Math.min(...ps.map(p=>p.y*h)),maxY=Math.max(...ps.map(p=>p.y*h));
 const mcx=(minX+maxX)/2,mcy=(minY+maxY)/2;
 const rx=(maxX-minX)/2+12,ry=(maxY-minY)/2+12;
 ctx.beginPath();ctx.ellipse(mcx,mcy,rx,ry,0,0,Math.PI*2);ctx.fill();
}
cutRegion(leftEye);cutRegion(rightEye);cutRegion(mouth);
ctx.globalCompositeOperation='source-over';
ctx.save();ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.clip();drawSeeds(ctx,cx,cy,r*1.1,fruit);ctx.restore();
if(fruit.id==='morango'||fruit.id==='pitanga'||fruit.id==='condessa'){
 const top=landmarks[10];ctx.font=r*0.55+'px serif';ctx.fillText('🌿',top.x*w-r*0.35,top.y*h-r*0.25);
}
ctx.restore();
}
function drawSeeds(ctx,cx,cy,r,fruit){
if(!fruit)return;ctx.save();
if(fruit.id==='morango'||fruit.id==='pitanga'){
 for(let i=0;i<22;i++){const ang=Math.random()*Math.PI*2;const rad=Math.random()*r*0.85;const x=cx+Math.cos(ang)*rad;const y=cy+Math.sin(ang)*rad*1.15;ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.ellipse(x,y,3.5,5,Math.random()*0.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(x-1,y-1,1.2,0,Math.PI*2);ctx.fill();}
}
if(fruit.id==='laranja'||fruit.id==='limao'){ctx.fillStyle='rgba(0,0,0,.12)';for(let i=0;i<45;i++){const a=Math.random()*Math.PI*2;const rad=Math.random()*r*0.85;const x=cx+Math.cos(a)*rad;const y=cy+Math.sin(a)*rad;ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill();}}
if(fruit.id==='uva'){for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2;const rad=Math.random()*r*0.8;const x=cx+Math.cos(a)*rad;const y=cy+Math.sin(a)*rad;ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(x,y,6+Math.random()*6,0,Math.PI*2);ctx.fill();}}
if(fruit.id==='banana'){ctx.strokeStyle='rgba(90,60,0,.15)';ctx.lineWidth=1;for(let i=0;i<5;i++){const y=cy-r*0.5+i*r*0.25;ctx.beginPath();ctx.moveTo(cx-r*0.7,y);ctx.quadraticCurveTo(cx,y+4,cx+r*0.7,y);ctx.stroke();}}
ctx.restore();
}
async function abrirCameraVideo(){document.getElementById('editor').classList.add('show');document.getElementById('camVideo').style.display='block';document.getElementById('faceCanvas').style.display='block';document.getElementById('prevVideo').style.display='none';document.getElementById('prevFoto').style.display='none';document.getElementById('btnRec').style.display='block';document.getElementById('btnFoto').style.display='none';document.getElementById('statusIA').style.display='block';montarFiltros();try{await startCamera();recorder=new MediaRecorder(stream,{mimeType:'video/webm'});chunks=[];recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};recorder.onstop=()=>{tempBlob=new Blob(chunks,{type:'video/webm'});document.getElementById('prevVideo').src=URL.createObjectURL(tempBlob);document.getElementById('prevVideo').style.display='block';document.getElementById('camVideo').style.display='none';document.getElementById('faceCanvas').style.display='none';document.getElementById('prevVideo').play();};}catch(e){alert('Libera câmera');}}
async function abrirCameraFoto(){document.getElementById('editor').classList.add('show');document.getElementById('camVideo').style.display='block';document.getElementById('faceCanvas').style.display='block';document.getElementById('prevVideo').style.display='none';document.getElementById('prevFoto').style.display='none';document.getElementById('btnRec').style.display='none';document.getElementById('btnFoto').style.display='block';document.getElementById('statusIA').style.display='block';montarFiltros();try{await startCamera();}catch(e){alert('Libera câmera');}}
function capturarFoto(){const video=document.getElementById('camVideo');const canvasFace=document.getElementById('faceCanvas');const out=document.createElement('canvas');out.width=video.videoWidth;out.height=video.videoHeight;const octx=out.getContext('2d');octx.drawImage(video,0,0);octx.drawImage(canvasFace,0,0);tempFoto=out.toDataURL('image/jpeg',0.9);document.getElementById('prevFoto').src=tempFoto;document.getElementById('prevFoto').style.display='block';document.getElementById('camVideo').style.display='none';document.getElementById('faceCanvas').style.display='none';}
function toggleRec(){if(!recorder){abrirCameraVideo();return;}if(!isRecording){chunks=[];recSec=0;isRecording=true;recorder.start(100);document.getElementById('btnRec').style.background='#fff';recTimer=setInterval(()=>{recSec++;document.getElementById('timer').innerText=String(Math.floor(recSec/60)).padStart(2,'0')+':'+String(recSec%60).padStart(2,'0');},1000);}else{isRecording=false;recorder.stop();document.getElementById('btnRec').style.background='#ff2d55';clearInterval(recTimer);}}
document.getElementById('fileGaleria').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;tempBlob=f;tempFoto=null;document.getElementById('prevVideo').src=URL.createObjectURL(f);document.getElementById('prevVideo').style.display='block';document.getElementById('camVideo').style.display='none';document.getElementById('faceCanvas').style.display='none';document.getElementById('prevVideo').play();document.getElementById('editor').classList.add('show');montarFiltros();});
document.getElementById('fileFoto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{tempFoto=ev.target.result;document.getElementById('prevFoto').src=tempFoto;document.getElementById('prevFoto').style.display='block';document.getElementById('prevVideo').style.display='none';document.getElementById('editor').classList.add('show');montarFiltros();};r.readAsDataURL(f);});
function fecharEditor(){document.getElementById('editor').classList.remove('show');document.getElementById('camVideo').style.display='none';document.getElementById('faceCanvas').style.display='none';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}if(recorder&&recorder.state!=='inactive')recorder.stop();clearInterval(recTimer);isRecording=false;if(faceLoopId)cancelAnimationFrame(faceLoopId);}
function togglePlay(card){const v=card.querySelector('video');if(!v)return;if(v.paused){v.play();}else{v.pause();}}
async function sharePost(t){if(navigator.share){try{await navigator.share({title:'Caiçara Play',text:t,url:location.href});return;}catch{}}alert(location.href);}
async function curtir(btn,id){const tx=db.transaction('videos','readwrite');const s=tx.objectStore('videos');s.get(id).onsuccess=e=>{const v=e.target.result;if(!v)return;v.liked=!v.liked;v.likes=(v.likes||0)+(v.liked?1:-1);if(v.likes<0)v.likes=0;s.put(v);btn.innerText=v.liked?'❤️':'🤍';btn.nextElementSibling.innerText=v.likes;};}
function showFeed(){document.getElementById('feed').style.display='block';document.getElementById('grid').style.display='none';render();}
function showGrid(){document.getElementById('feed').style.display='none';document.getElementById('grid').style.display='grid';render();}
function setupObserver(){const opt={root:document.getElementById('feed'),threshold:0.6};const obs=new IntersectionObserver(es=>{es.forEach(en=>{const v=en.target.querySelector('video');if(en.isIntersecting){document.querySelectorAll('#feed video').forEach(x=>{if(x!==v)x.pause();});if(v){v.muted=false;v.play().catch(()=>{});}}else{if(v)v.pause();}});},opt);document.querySelectorAll('.card').forEach(c=>obs.observe(c));}
async function render(){const vids=await getVideos();const feed=document.getElementById('feed');const grid=document.getElementById('grid');if(!vids.length){feed.innerHTML=`<div class="card" style="flex-direction:column"><p style="font-size:56px">🌊🍓</p><p style="font-weight:900;margin-top:10px;font-size:20px">V33 Frutinha Fofa</p><p style="opacity:.6;font-size:12px;margin-top:6px">Rosto livre, óculos aparece! 👓</p><p style="opacity:.6;font-size:11px">9 frutinhas + foto na hora 📷</p><button onclick="abrirEscolha()" style="margin-top:18px;background:#ff2d55;color:#fff;border:none;padding:12px 24px;border-radius:20px;font-weight:900">+ Postar fofo 🍓</button></div>`;grid.innerHTML='';return;}feed.innerHTML=vids.map(v=>{const media=v.type==='foto'?`<img src="${v.fotoData}">`:`<video loop playsinline src="${URL.createObjectURL(v.blob)}" muted></video>`;return `<div class="card" onclick="togglePlay(this)"><div class="tap"><div class="ico">▶️</div></div>${media}<div class="side"><div style="display:flex;flex-direction:column;align-items:center"><button onclick="event.stopPropagation();curtir(this,${v.id})">${v.liked?'❤️':'🤍'}</button><span>${v.likes||0}</span></div><button onclick="event.stopPropagation();sharePost('${(v.desc||'').replace(/'/g,'')}')">↗️</button><button>💬</button></div><div class="info"><div style="display:flex;align-items:center"><b>${v.user}</b><button class="follow" onclick="event.stopPropagation();this.innerText=this.innerText==='Seguir'?'Seguindo':'Seguir'">Seguir</button></div><div style="font-size:13px;margin-top:4px">${v.emoji||''} ${v.desc}</div></div></div>`;}).join('');grid.innerHTML=vids.map(v=>v.type==='foto'?`<img src="${v.fotoData}" style="width:100%;aspect-ratio:9/16;object-fit:cover">`:`<video src="${URL.createObjectURL(v.blob)}" muted loop style="width:100%;aspect-ratio:9/16;object-fit:cover"></video>`).join('');setTimeout(setupObserver,300);}
document.getElementById('btnPost').onclick=async()=>{const me=JSON.parse(localStorage.getItem('caicara_user')||'{"usuario":"@taki"}');const desc=document.getElementById('leg').value||'Frutinha fofa '+currentFiltro.emoji+' 🌊';if(!tempBlob&&!tempFoto){alert('Tira foto ou grava vídeo!');return;}document.getElementById('btnPost').innerText='Salvando...';if(tempFoto){await addVideo({user:me.usuario,desc,type:'foto',fotoData:tempFoto,emoji:currentFiltro.emoji,likes:0});}else{await addVideo({user:me.usuario,desc,type:'video',blob:tempBlob,emoji:currentFiltro.emoji,likes:0});}fecharEditor();tempBlob=null;tempFoto=null;document.getElementById('btnPost').innerText='Postar';showFeed();};
document.getElementById('zap').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2').slice(0,15);});
openDB().then(()=>{const users=getUsers();if(users.length==0){const admin={nome:'Taki',usuario:'@taki',zap:'(12) 99999-9999',nasc:'2000-01-01',idade:26,senha:'123456'};saveUsers([admin]);}checarLogin();render();});
</script>
