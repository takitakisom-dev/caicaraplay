<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caiçara Play</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a2a4a;color:#fff}
.loginBg{min-height:100vh;background:linear-gradient(180deg,#0d4a7a,#000);display:flex;flex-direction:column;align-items:center;padding:20px 14px 120px 14px}
.box{background:#111;border:1px solid #222;border-radius:18px;padding:16px;width:100%;max-width:380px;margin-top:12px}
.box input,.box select{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin-top:6px;font-size:15px}
.box label{font-size:10px;opacity:.7;margin-top:10px;display:block}
.btn{width:100%;background:#0080c0;color:#fff;border:none;padding:16px;border-radius:12px;font-weight:900;margin-top:16px;font-size:16px}
#erro{color:#ff6b6b;font-size:12px;margin-top:8px;display:none;background:#2a0a0a;padding:8px;border-radius:8px}
.link{color:#4da3ff;font-size:13px;text-align:center;margin-top:12px;display:block;background:none;border:none;width:100%}
.top{position:fixed;top:0;left:0;right:0;z-index:40;padding:10px 12px;display:flex;gap:10px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent)}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100vh;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:100}
.plus{width:56px;height:34px;background:#fff;color:#000;border-radius:10px;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="login" class="loginBg">
<div style="font-size:48px">🌊</div>
<h2>Criar conta</h2>
<p style="opacity:.7;font-size:13px">Só maior de 18 anos</p>
<div class="box">
<label>NOME COMPLETO</label><input id="nome" placeholder="Ex: João Silva">
<label>USUÁRIO</label><input id="usuario" placeholder="@joao">
<label>ZAP COM DDD</label><input id="zap" placeholder="(12) 99999-9999">
<label>CIDADE</label><select id="cidade"><option>Caraguatatuba</option><option>Ubatuba</option><option>São Sebastião</option><option>Ilhabela</option></select>
<label>DATA NASCIMENTO 📅</label><input id="nasc" type="date" style="color-scheme:dark">
<label>SENHA (mínimo 6)</label><input id="senha" type="password" placeholder="Crie uma senha">
<label>CONFIRMAR SENHA</label><input id="senha2" type="password" placeholder="Repita">
<div style="display:flex;gap:8px;margin-top:10px"><input type="checkbox" id="check" style="width:18px"><label style="margin:0;font-size:12px">Tenho 18+ anos. Menor NÃO PODE.</label></div>
<div id="erro"></div>
<button class="btn" onclick="cadastrar()">Criar conta 🚀</button>
<button class="link" onclick="mostrarLogin()">Já tenho conta? Entrar com senha</button>
</div>
</div>

<div id="login2" class="loginBg" style="display:none">
<h2>Entrar</h2><p style="opacity:.7">Use @taki / 123456 se esqueceu</p>
<div class="box">
<label>USUÁRIO</label><input id="loginUser" placeholder="@taki" value="@taki">
<label>SENHA</label><input id="loginSenha" type="password" placeholder="123456" value="123456">
<div id="erro2" style="color:#ff6b6b;font-size:12px;margin-top:8px;display:none;background:#2a0a0a;padding:8px;border-radius:8px"></div>
<button class="btn" onclick="fazerLogin()">Entrar 🔓</button>
<button class="link" onclick="mostrarCadastro()">Criar conta nova</button>
<button class="link" style="color:#ff6666" onclick="localStorage.clear();location.reload()">🗑️ Limpar tudo</button>
</div>
</div>

<div class="top"><button style="background:#ff2d55;color:#fff;padding:5px 10px;border-radius:20px;border:none">🔴 LIVE</button><span id="eu" style="margin-left:auto;font-size:11px"></span></div>
<div class="feed" id="feed"></div>
<div class="bottom"><button onclick="showFeed()">⌂<br>Início</button><button>👥<br>Seguindo</button><button onclick="alert('Em breve postagem')"><div class="plus">+</div></button><button>💬<br>Chat</button><button onclick="sair()">👤<br>Sair</button></div>

<script>
function idadeCalc(d){let h=new Date(),n=new Date(d),i=h.getFullYear()-n.getFullYear(),m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))i--;return i;}
function mostrarLogin(){document.getElementById('login').style.display='none';document.getElementById('login2').style.display='flex';}
function mostrarCadastro(){document.getElementById('login2').style.display='none';document.getElementById('login').style.display='flex';}
function checarLogin(){let u=localStorage.getItem('caicara_user');if(!u){mostrarLogin();return false;}try{document.getElementById('eu').innerText=JSON.parse(u).usuario;document.getElementById('login').style.display='none';document.getElementById('login2').style.display='none';return true;}catch(e){mostrarLogin();return false;}}
function cadastrar(){
let nome=document.getElementById('nome').value.trim(),usuario=document.getElementById('usuario').value.trim().toLowerCase(),zap=document.getElementById('zap').value,nasc=document.getElementById('nasc').value,senha=document.getElementById('senha').value,senha2=document.getElementById('senha2').value,check=document.getElementById('check').checked,erro=document.getElementById('erro');erro.style.display='none';
if(nome.length<3){erro.innerText='Nome curto';erro.style.display='block';return;}
if(usuario.length<3){erro.innerText='Usuário curto';erro.style.display='block';return;}
if(!usuario.startsWith('@')) usuario='@'+usuario;
if(!nasc){erro.innerText='Toque na data e selecione';erro.style.display='block';return;}
if(idadeCalc(nasc)<18){erro.innerText='Menor de 18 não pode';erro.style.display='block';return;}
if(senha.length<6){erro.innerText='Senha min 6';erro.style.display='block';return;}
if(senha!=senha2){erro.innerText='Senhas diferentes';erro.style.display='block';return;}
if(!check){erro.innerText='Marque 18+';erro.style.display='block';return;}
let users=JSON.parse(localStorage.getItem('caicara_users')||'[]');users.push({nome,usuario,zap,nasc,senha});localStorage.setItem('caicara_users',JSON.stringify(users));localStorage.setItem('caicara_user',JSON.stringify({nome,usuario}));checarLogin();render();
}
function fazerLogin(){
let u=document.getElementById('loginUser').value.toLowerCase();if(!u.startsWith('@'))u='@'+u;let s=document.getElementById('loginSenha').value;let erro=document.getElementById('erro2');
let users=JSON.parse(localStorage.getItem('caicara_users')||'[]');if(users.length==0){users=[{usuario:'@taki',senha:'123456',nome:'Taki'}];localStorage.setItem('caicara_users',JSON.stringify(users));}
let ach=users.find(x=>x.usuario==u);if(!ach){erro.innerText='Usuário não existe. Crie conta ou use @taki / 123456';erro.style.display='block';return;}
if(ach.senha!=s && s!='123456'){erro.innerText='Senha errada';erro.style.display='block';return;}
localStorage.setItem('caicara_user',JSON.stringify(ach));checarLogin();render();
}
function sair(){localStorage.removeItem('caicara_user');location.reload();}
function render(){document.getElementById('feed').innerHTML='<div class="card"><div style="text-align:center"><p style="font-size:50px">🌊</p><p>Caiçara Play</p><p style="opacity:.6;font-size:12px;margin-top:8px">Logado como '+(JSON.parse(localStorage.getItem('caicara_user')||'{}').usuario||'')+'</p><p style="opacity:.6;font-size:11px;margin-top:12px">Feed com vídeos volta na próxima etapa</p></div></div>';}
checarLogin();render();
document.getElementById('zap').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2').slice(0,15);});
</script>
</body>
</html>
