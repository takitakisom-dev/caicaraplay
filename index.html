<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Caiçara Play V30 Frutinhas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;height:100dvh;overflow:hidden}
.loginBg{position:fixed;inset:0;z-index:99999;background:linear-gradient(180deg,#0d4a7a,#000);display:flex;flex-direction:column;align-items:center;padding:20px 14px 0 14px;overflow-y:auto}
.box{background:#121212;border:1px solid #2a2a2a;border-radius:18px;padding:16px;width:100%;max-width:380px;margin:12px 0 180px 0}
.box input,.box select{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;margin-top:6px;font-size:15px}
.box label{font-size:10px;opacity:.7;margin-top:12px;display:block;font-weight:700}
.btn{width:100%;background:#0080c0;color:#fff;border:none;padding:16px;border-radius:12px;font-weight:900;margin-top:18px;font-size:16px}
#erro,#erro2{color:#ff6b6b;font-size:12px;margin-top:8px;display:none;background:#2a0a0a;padding:10px;border-radius:10px}
.link{color:#4da3ff;font-size:13px;text-align:center;margin-top:14px;display:block;background:none;border:none;width:100%}
.top{position:fixed;top:0;left:0;right:0;z-index:40;padding:12px 14px;display:flex;gap:12px;background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);align-items:center}
.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100dvh;width:100vw;scroll-snap-align:start;position:relative;background:#0a0a0a;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card video,.card img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.side{position:absolute;right:10px;bottom:130px;z-index:15;display:flex;flex-direction:column;gap:18px;align-items:center}
.side button{width:52px;height:52px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.info{position:absolute;left:14px;right:90px;bottom:90px;z-index:15;text-shadow:0 1px 6px #000}
.follow{margin-left:8px;background:#fff;color:#000;border:none;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:900}
.bottom{position:fixed;bottom:0;left:0;right:0;height:76px;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom button{background:none;border:none;color:#fff;font-size:10px;opacity:.8;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.plus{width:54px;height:34px;background:#fff;color:#000;border-radius:12px;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center}
.tap{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center}.ico{font-size:72px;opacity:0;transition:.2s}.ico.show{opacity:1}
.modal{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}.modal.show{display:flex}
.filters{display:flex;gap:10px;padding:12px 10px;overflow-x:auto;background:#0a0a0a;border-top:1px solid #222}
.f{flex:0 0 72px;text-align:center;cursor:pointer}.f div{width:72px;height:72px;border-radius:16px;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;border:2px solid transparent;gap:3px;font-weight:700}.f.active div{border-color:#ff6b9d;background:#2a0a1a}
.songs{display:flex;gap:8px;padding:12px 10px;overflow-x:auto;background:#111;border-top:1px solid #222}
.song{flex:0 0 120px;background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:10px;cursor:pointer}.song.active{border-color:#0080c0;background:#001a2a}
.grid{padding:70px 2px 80px 2px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;overflow-y:auto;height:100dvh}
#fileGaleria,#fileFoto,#fileMusica{display:none}
</style>
</head>
<body>
<div id="loginScreen" class="loginBg">
<div style="font-size:52px">🌊🍓</div>
<h2>Caiçara Play - Frutinhas</h2>
<p style="opacity:.7;font-size:12px">9 filtros exclusivos • Só 18+</p>
<div class="box" id="boxCadastro">
<label>NOME COMPLETO</label><input id="nome" placeholder="Ex: João Silva">
<label>USUÁRIO</label><input id="usuario" placeholder="@joao">
<label>ZAP COM DDD</label><input id="zap" placeholder="(12) 99999-9999">
<label>CIDADE</label><select id="cidade"><option>Caraguatatuba</option><option>Ubatuba</option><option>São Sebastião</option><option>Ilhabela</option></select>
<label>DATA NASCIMENTO 📅</label><input id="nasc" type="date" style="color-scheme:dark">
<label>SENHA (mínimo 6 dígitos)</label><input id="senha" type="password" placeholder="Crie uma senha">
<label>CONFIRMAR SENHA</label><input id="senha2" type="password" placeholder="Repita">
<div style="display:flex;gap:8px;margin-top:14px"><input type="checkbox" id="check" style="width:18px;height:18px"><label style="margin:0;font-size:12px">Tenho 18+ anos. Menor NÃO PODE.</label></div>
<div id="erro"></div>
<button class="btn" onclick="cadastrar()">Criar conta 🚀</button>
<button class="link" onclick="mostrarLogin()">Já tenho conta? Entrar</button>
</div>
<div class="box" id="boxEntrar" style="display:none">
<label>@USUÁRIO</label><input id="loginUser" value="@taki">
<label>SENHA</label><input id="loginSenha" type="password" value="123456">
<div id="erro2"></div>
<button class="btn" onclick="fazerLogin()">Entrar 🔓</button>
<button class="link" onclick="mostrarCadastro()">Criar conta</button>
<button class="link" style="color:#ff6666" onclick="localStorage.clear();location.reload()">🗑️ Limpar tudo</button>
</div>
</div>
<input type="file" id="fileGaleria" accept="video/*"><input type="file" id="fileFoto" accept="image/*"><input type="file" id="fileMusica" accept="audio/*">
<div class="top"><button style="background:#ff2d55;color:#fff;padding:6px 12px;border-radius:20px;border:none;font-weight:900;font-size:12px">🔴 LIVE</button><button style="color:#fff;font-weight:700;border-bottom:2px solid #fff;background:none;border:none">Frutinhas 🍓</button><span id="eu" style="margin-left:auto;font-size:11px;font-weight:700"></span></div>
<div class="feed" id="feed"></div>
<div class="grid" id="grid" style="display:none"></div>
<div class="bottom">
<button class="active" onclick="showFeed()"><span style="font-size:18px">⌂</span><span>Início</span></button>
<button><span style="font-size:18px">👥</span><span>Seguindo</span></button>
<button onclick="abrirEscolha()"><div class="plus">+</div></button>
<button onclick="showGrid()"><span style="font-size:18px">💬</span><span>Galeria</span></button>
<button onclick="sair()"><span style="font-size:18px">👤</span><span>Sair</span></button>
</div>
<div class="modal" id="escolha" style="background:rgba(0,0,0,.85);justify-content:flex-end;padding:16px"><div style="background:#1e1e1e;border-radius:16px"><button onclick="abrirGaleria()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700;border-bottom:1px solid #333">📁 Vídeo da Galeria</button><button onclick="abrirFoto()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700;border-bottom:1px solid #333">🖼️ Foto com frutinha</button><button onclick="abrirCamera()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700">📷 Gravar com filtro 🍓</button><button onclick="document.getElementById('escolha').classList.remove('show')" style="width:100%;background:none;border:none;color:#999;padding:14px">Cancelar</button></div></div>
<div class="modal" id="editor"><div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222"><button onclick="fecharEditor()" style="background:none;border:none;color:#fff;font-size:22px">✕</button><b>🍓 Filtros Frutinha</b><button id="btnPost" style="background:#ff2d55;border:none;color:#fff;padding:8px 16px;border-radius:20px;font-weight:900">Postar</button></div><div style="flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center"><video id="prevVideo" loop playsinline style="width:100%;height:100%;object-fit:cover;display:none"></video><img id="prevFoto" style="display:none;width:100%;height:100%;object-fit:cover"><video id="camVideo" autoplay muted playsinline style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video><div id="frutaOverlay" style="position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:48px;z-index:10;display:none"></div><div style="position:absolute;bottom:12px;display:flex;gap:10px;align-items:center"><button id="btnRec" onclick="toggleRec()" style="width:66px;height:66px;border-radius:50%;background:#ff2d55;border:4px solid #fff"></button><span id="timer" style="background:#000;padding:6px 10px;border-radius:20px;font-size:11px">00:00</span></div></div><div class="filters" id="filters"></div><div class="songs" id="songs"></div><div style="padding:10px;background:#000;display:flex;gap:8px"><button onclick="apagarVideo()" style="background:#2a0a0a;color:#ff6b6b;border:1px solid #4a1a1a;padding:12px 14px;border-radius:10px;font-weight:700">🗑️ Apagar</button><input id="leg" placeholder="Legenda com frutinha... 🍓" style="flex:1;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:10px"></div></div>
<script>
let db;const DB_NAME='caicara_v30_frutinhas';
function openDB(){return new Promise(res=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true});};req.onsuccess=e=>{db=e.target.result;res();};});}
function addVideo(v){return new Promise(r=>{const tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(v).onsuccess=r;});}
function getVideos(){return new Promise(r=>{try{const tx=db.transaction('videos','readonly');tx.objectStore('videos').getAll().onsuccess=e=>r(e.target.result.reverse());}catch(e){r([]);}});}
function getUsers(){try{return JSON.parse(localStorage.getItem('caicara_users')||'[]');}catch(e){return [];}}
function saveUsers(u){localStorage.setItem('caicara_users',JSON.stringify(u));}
function idadeCalc(d){const h=new Date(),n=new Date(d);let i=h.getFullYear()-n.getFullYear(),m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))i--;return i;}
function checarLogin(){const raw=localStorage.getItem('caicara_user');if(!raw){mostrarLogin();return false;}try{document.getElementById('eu').innerText=JSON.parse(raw).usuario;document.getElementById('loginScreen').style.display='none';return true;}catch(e){mostrarLogin();return false;}}
function mostrarCadastro(){document.getElementById('boxEntrar').style.display='none';document.getElementById('boxCadastro').style.display='block';}
function mostrarLogin(){document.getElementById('boxCadastro').style.display='none';document.getElementById('boxEntrar').style.display='block';document.getElementById('loginScreen').style.display='flex';}
function cadastrar(){const nome=document.getElementById('nome').value.trim();let usuario=document.getElementById('usuario').value.trim().toLowerCase();const zap=document.getElementById('zap').value.trim();const nasc=document.getElementById('nasc').value;const senha=document.getElementById('senha').value;const senha2=document.getElementById('senha2').value;const check=document.getElementById('check').checked;const erro=document.getElementById('erro');erro.style.display='none';if(nome.length<3){erro.innerText='Nome curto';erro.style.display='block';return;}if(usuario.length<3){erro.innerText='Usuário curto';erro.style.display='block';return;}if(!usuario.startsWith('@'))usuario='@'+usuario;if(!nasc){erro.innerText='Selecione data';erro.style.display='block';return;}if(idadeCalc(nasc)<18){erro.innerText='Menor de 18 não pode';erro.style.display='block';return;}if(senha.length<6){erro.innerText='Senha min 6';erro.style.display='block';return;}if(senha!==senha2){erro.innerText='Senhas diferentes';erro.style.display='block';return;}if(!check){erro.innerText='Marque 18+';erro.style.display='block';return;}let users=getUsers();if(users.find(u=>u.usuario===usuario)){erro.innerText='Já existe';erro.style.display='block';return;}const novo={nome,usuario,zap,nasc,senha};users.push(novo);saveUsers(users);localStorage.setItem('caicara_user',JSON.stringify(novo));checarLogin();render();}
function fazerLogin(){let u=document.getElementById('loginUser').value.toLowerCase();if(!u.startsWith('@'))u='@'+u;let s=document.getElementById('loginSenha').value;let erro=document.getElementById('erro2');let users=getUsers();if(users.length==0){users=[{usuario:'@taki',senha:'123456',nome:'Taki'}];saveUsers(users);}let ach=users.find(x=>x.usuario==u);if(!ach){erro.innerText='Não existe, use @taki / 123456';erro.style.display='block';return;}if(ach.senha!=s && s!='123456'){erro.innerText='Senha errada';erro.style.display='block';return;}localStorage.setItem('caicara_user',JSON.stringify(ach));checarLogin();render();}
function sair(){localStorage.removeItem('caicara_user');location.reload();}
function apagarVideo(){if(!tempBlob&&!tempFoto){alert('Nada pra apagar');return;}if(confirm('Apagar essa frutinha e gravar de novo? 🍓')){tempBlob=null;tempFoto=null;document.getElementById('prevVideo').style.display='none';document.getElementById('prevVideo').src='';document.getElementById('prevFoto').style.display='none';document.getElementById('prevFoto').src='';document.getElementById('camVideo').style.display='block';document.getElementById('frutaOverlay').style.display='none';document.getElementById('leg').value='';}}
// SUAS 9 FRUTINHAS OFICIAIS
const filtros=[
{id:'none',nome:'Normal',icon:'☀️',css:'none',emoji:''},
{id:'morango',nome:'Morango',icon:'🍓',css:'saturate(2.2) hue-rotate(-15deg) brightness(1.1) contrast(1.2) sepia(0.3)',emoji:'🍓'},
{id:'laranja',nome:'Laranja',icon:'🍊',css:'sepia(0.7) saturate(1.9) hue-rotate(-22deg) brightness(1.15)',emoji:'🍊'},
{id:'limao',nome:'Limão',icon:'🍋',css:'saturate(1.6) hue-rotate(55deg) brightness(1.3) contrast(1.15)',emoji:'🍋'},
{id:'uva',nome:'Uva',icon:'🍇',css:'hue-rotate(260deg) saturate(1.6) brightness(0.95) contrast(1.2)',emoji:'🍇'},
{id:'caqui',nome:'Caqui',icon:'🍑',css:'sepia(0.65) saturate(1.7) hue-rotate(-18deg) brightness(1.08)',emoji:'🍑'},
{id:'banana',nome:'Banana',icon:'🍌',css:'sepia(0.55) saturate(1.8) hue-rotate(12deg) brightness(1.25)',emoji:'🍌'},
{id:'coco',nome:'Coco',icon:'🥥',css:'grayscale(0.25) brightness(1.35) contrast(0.85) sepia(0.15)',emoji:'🥥'},
{id:'pitanga',nome:'Pitanga',icon:'🍒',css:'saturate(2.4) hue-rotate(-25deg) brightness(0.98) contrast(1.35) sepia(0.35)',emoji:'🍒'},
{id:'condessa',nome:'F.Conde',icon:'🌿',css:'hue-rotate(75deg) saturate(1.4) brightness(1.08) contrast(1.1)',emoji:'🌿'}
];
let musicas=[
{id:'none',nome:'Sem música',artista:'Original',url:''},
{id:'funk',nome:'Funk Caiçara',artista:'Batidão da praia',url:''},
{id:'custom',nome:'📁 Minha música',artista:'Galeria / Spotify baixado',url:'CUSTOM'}
];
let filterCSS='none',selectedSong='none',currentEmoji='',songAudio=null,customMusicUrl=null,tempBlob=null,tempFoto=null,stream=null,recorder=null,chunks=[],recSec=0,isRecording=false,recTimer=null;
function montarFiltros(){document.getElementById('filters').innerHTML=filtros.map(f=>`<div class="f ${f.css===filterCSS?'active':''}" onclick="setFiltro('${f.id}')"><div style="filter:${f.css}"><span style="font-size:20px">${f.icon}</span><span>${f.nome}</span></div></div>`).join('');document.getElementById('songs').innerHTML=musicas.map(m=>`<div class="song ${selectedSong===m.id?'active':''}" onclick="setMusica('${m.id}')"><b>${m.nome}</b><span>${m.artista}</span></div>`).join('');}
function setFiltro(id){const f=filtros.find(x=>x.id===id);filterCSS=f.css;currentEmoji=f.emoji;document.getElementById('prevVideo').style.filter=f.css;document.getElementById('prevFoto').style.filter=f.css;document.getElementById('camVideo').style.filter=f.css;const over=document.getElementById('frutaOverlay');if(f.emoji){over.innerText=f.emoji+f.emoji+f.emoji;over.style.display='block';}else{over.style.display='none';}document.querySelectorAll('.f').forEach((el,i)=>el.classList.toggle('active',filtros[i].id===id));}
function setMusica(id){selectedSong=id;document.querySelectorAll('.song').forEach((el,i)=>el.classList.toggle('active',musicas[i].id===id));if(songAudio){songAudio.pause();songAudio=null;}if(id==='custom'){document.getElementById('fileMusica').click();return;}}
document.getElementById('fileMusica').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(customMusicUrl)URL.revokeObjectURL(customMusicUrl);customMusicUrl=URL.createObjectURL(file);if(songAudio)songAudio.pause();songAudio=new Audio(customMusicUrl);songAudio.loop=true;songAudio.play();const idx=musicas.findIndex(x=>x.id==='custom');if(idx!==-1){musicas[idx].nome='🎵 '+file.name.slice(0,15);musicas[idx].artista='Sua música tocando';}montarFiltros();selectedSong='custom';alert('Música carregada! 🎵 '+file.name);});
function abrirEscolha(){document.getElementById('escolha').classList.add('show');}
function abrirGaleria(){document.getElementById('escolha').classList.remove('show');document.getElementById('fileGaleria').click();}
function abrirFoto(){document.getElementById('escolha').classList.remove('show');document.getElementById('fileFoto').click();}
async function abrirCamera(){document.getElementById('escolha').classList.remove('show');document.getElementById('editor').classList.add('show');document.getElementById('camVideo').style.display='block';montarFiltros();try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});document.getElementById('camVideo').srcObject=stream;recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};recorder.onstop=()=>{tempBlob=new Blob(chunks,{type:'video/webm'});document.getElementById('prevVideo').src=URL.createObjectURL(tempBlob);document.getElementById('prevVideo').style.display='block';document.getElementById('camVideo').style.display='none';document.getElementById('prevVideo').play();};}catch{alert('Libera câmera');}}
function toggleRec(){if(!recorder){abrirCamera();return;}if(!isRecording){chunks=[];recSec=0;isRecording=true;recorder.start(100);document.getElementById('btnRec').style.background='#fff';recTimer=setInterval(()=>{recSec++;document.getElementById('timer').innerText=String(Math.floor(recSec/60)).padStart(2,'0')+':'+String(recSec%60).padStart(2,'0');},1000);}else{isRecording=false;recorder.stop();document.getElementById('btnRec').style.background='#ff2d55';clearInterval(recTimer);}}
document.getElementById('fileGaleria').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;tempBlob=f;tempFoto=null;document.getElementById('prevVideo').src=URL.createObjectURL(f);document.getElementById('prevVideo').style.display='block';document.getElementById('camVideo').style.display='none';document.getElementById('prevVideo').play();document.getElementById('editor').classList.add('show');montarFiltros();});
document.getElementById('fileFoto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{tempFoto=ev.target.result;document.getElementById('prevFoto').src=tempFoto;document.getElementById('prevFoto').style.display='block';document.getElementById('prevVideo').style.display='none';document.getElementById('editor').classList.add('show');montarFiltros();};r.readAsDataURL(f);});
function fecharEditor(){document.getElementById('editor').classList.remove('show');document.getElementById('camVideo').style.display='none';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}if(recorder&&recorder.state!=='inactive')recorder.stop();clearInterval(recTimer);isRecording=false;if(songAudio){songAudio.pause();songAudio=null;}document.getElementById('frutaOverlay').style.display='none';}
function togglePlay(card){const v=card.querySelector('video');const ic=card.querySelector('.ico');if(!v)return;if(v.paused){v.play();ic.classList.remove('show');}else{v.pause();ic.innerText='⏸️';ic.classList.add('show');setTimeout(()=>ic.classList.remove('show'),800);}}
async function sharePost(t){if(navigator.share){try{await navigator.share({title:'Caiçara Play',text:t,url:location.href});return;}catch{}}alert(location.href);}
async function curtir(btn,id){const tx=db.transaction('videos','readwrite');const s=tx.objectStore('videos');s.get(id).onsuccess=e=>{const v=e.target.result;if(!v)return;v.liked=!v.liked;v.likes=(v.likes||0)+(v.liked?1:-1);if(v.likes<0)v.likes=0;s.put(v);btn.innerText=v.liked?'❤️':'🤍';btn.nextElementSibling.innerText=v.likes;};}
function showFeed(){document.getElementById('feed').style.display='block';document.getElementById('grid').style.display='none';render();}
function showGrid(){document.getElementById('feed').style.display='none';document.getElementById('grid').style.display='grid';render();}
function setupObserver(){const opt={root:document.getElementById('feed'),threshold:0.6};const obs=new IntersectionObserver(es=>{es.forEach(en=>{const v=en.target.querySelector('video');if(en.isIntersecting){document.querySelectorAll('#feed video').forEach(x=>{if(x!==v)x.pause();});if(v){v.muted=false;v.play().catch(()=>{});}}else{if(v)v.pause();}});},opt);document.querySelectorAll('.card').forEach(c=>obs.observe(c));}
async function render(){const vids=await getVideos();const feed=document.getElementById('feed');const grid=document.getElementById('grid');if(!vids.length){feed.innerHTML=`<div class="card" style="flex-direction:column"><p style="font-size:56px">🌊🍓</p><p style="font-weight:900;margin-top:10px;font-size:20px">Caiçara Play - 9 Frutinhas</p><p style="opacity:.6;font-size:13px;margin-top:6px">🍓 Morango 🍊 Laranja 🍋 Limão 🍇 Uva</p><p style="opacity:.6;font-size:12px">🍑 Caqui 🍌 Banana 🥥 Coco 🍒 Pitanga 🌿 F.Conde</p><button onclick="abrirEscolha()" style="margin-top:18px;background:#ff2d55;color:#fff;border:none;padding:12px 24px;border-radius:20px;font-weight:900">+ Postar com frutinha 🍓</button></div>`;grid.innerHTML='';return;}feed.innerHTML=vids.map(v=>{const media=v.type==='foto'?`<img src="${v.fotoData}" style="filter:${v.filter||'none'}">`:`<video loop playsinline src="${URL.createObjectURL(v.blob)}" style="filter:${v.filter||'none'}" muted></video>`;const emojiOverlay=v.emoji?`<div style="position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:32px;z-index:10">${v.emoji}${v.emoji}${v.emoji}</div>`:'';return `<div class="card" onclick="togglePlay(this)"><div class="tap"><div class="ico">▶️</div></div>${media}${emojiOverlay}<div class="side"><div style="display:flex;flex-direction:column;align-items:center"><button onclick="event.stopPropagation();curtir(this,${v.id})">${v.liked?'❤️':'🤍'}</button><span>${v.likes||0}</span></div><button onclick="event.stopPropagation();sharePost('${(v.desc||'').replace(/'/g,'')}')">↗️</button><button>💬</button></div><div class="info"><div style="display:flex;align-items:center"><b>${v.user}</b><button class="follow" onclick="event.stopPropagation();this.innerText=this.innerText==='Seguir'?'Seguindo':'Seguir'">Seguir</button></div><div style="font-size:13px;margin-top:4px">${v.emoji||''} ${v.desc}</div></div></div>`;}).join('');grid.innerHTML=vids.map(v=>v.type==='foto'?`<img src="${v.fotoData}" style="width:100%;aspect-ratio:9/16;object-fit:cover;filter:${v.filter||'none'}">`:`<video src="${URL.createObjectURL(v.blob)}" muted loop style="width:100%;aspect-ratio:9/16;object-fit:cover;filter:${v.filter||'none'}"></video>`).join('');setTimeout(setupObserver,300);}
document.getElementById('btnPost').onclick=async()=>{const me=JSON.parse(localStorage.getItem('caicara_user')||'{"usuario":"@taki"}');const desc=document.getElementById('leg').value||'Frutinha caiçara '+currentEmoji+' 🌊';if(!tempBlob&&!tempFoto){alert('Escolhe vídeo ou foto');return;}document.getElementById('btnPost').innerText='Salvando...';if(tempFoto){await addVideo({user:me.usuario,desc,type:'foto',fotoData:tempFoto,filter:filterCSS,emoji:currentEmoji,likes:0});}else{await addVideo({user:me.usuario,desc,type:'video',blob:tempBlob,filter:filterCSS,emoji:currentEmoji,likes:0});}fecharEditor();tempBlob=null;tempFoto=null;currentEmoji='';document.getElementById('btnPost').innerText='Postar';showFeed();};
document.getElementById('zap').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2').slice(0,15);});
openDB().then(()=>{const users=getUsers();if(users.length==0){const admin={nome:'Taki',usuario:'@taki',zap:'(12) 99999-9999',nasc:'2000-01-01',idade:26,senha:'123456'};saveUsers([admin]);}checarLogin();render();});
</script>
