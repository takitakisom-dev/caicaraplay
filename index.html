<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caiçara Play</title>
<meta name="theme-color" content="#0080c0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff}
#login{position:fixed;inset:0;z-index:99999;background:linear-gradient(180deg,#003a6b,#000);display:flex;flex-direction:column;align-items:center;padding:20px;overflow-y:auto}
.box{background:#111;border:1px solid #222;border-radius:20px;padding:18px;width:100%;max-width:380px;margin-top:12px}
.box input,.box select{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;margin-top:6px;font-size:15px}
.box label{font-size:10px;opacity:.6;margin-top:10px;display:block}
#erro{color:#ff4444;font-size:12px;margin-top:8px;display:none;background:#2a0000;padding:8px;border-radius:8px}
.btn{width:100%;background:#0080c0;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;margin-top:14px;font-size:16px}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;padding-top:60px;padding-bottom:80px}
.card{height:90vh;background:#111;margin:10px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;scroll-snap-align:start}
.top{position:fixed;top:0;left:0;right:0;z-index:50;background:#000;padding:12px;display:flex;gap:12px;border-bottom:1px solid #222}
.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:50}
.bottom button{background:none;border:none;color:#fff;font-size:11px}
</style>
</head>
<body>

<div id="login">
<div style="font-size:60px">🌊</div>
<h2>Caiçara Play</h2>
<p style="opacity:.7;font-size:13px;margin-top:4px">Cadastro obrigatório - Só +18</p>
<div class="box">
<label>NOME COMPLETO</label>
<input id="nome" placeholder="Ex: João Silva">
<label>USUÁRIO</label>
<input id="usuario" placeholder="Ex: @joao">
<label>ZAP COM DDD</label>
<input id="zap" placeholder="(12) 99999-9999" inputmode="numeric">
<label>CIDADE</label>
<select id="cidade"><option>Caraguatatuba</option><option>Ubatuba</option><option>São Sebastião</option><option>Ilhabela</option><option>Paraty</option></select>
<label>DATA NASCIMENTO</label>
<input id="nasc" type="date">
<div style="display:flex;gap:8px;margin-top:12px"><input type="checkbox" id="check" style="width:18px"><label style="margin:0;font-size:12px">Tenho 18+ anos. Menor de 18 NÃO PODE se cadastrar.</label></div>
<div id="erro"></div>
<button class="btn" onclick="cadastrar()">Criar minha conta 🚀</button>
</div>
</div>

<div class="top"><button style="background:#ff2d55;color:#fff;padding:6px 12px;border-radius:20px;border:none;font-weight:900">🔴 LIVE</button><b>Para você</b><span style="opacity:.6">Galeria</span><span id="eu" style="margin-left:auto;font-size:11px"></span></div>
<div class="feed" id="feed"></div>
<div class="bottom"><button>⌂<br>Início</button><button>👥<br>Seguindo</button><button onclick="document.getElementById('file').click()" style="background:#fff;color:#000;width:56px;height:36px;border-radius:10px;font-size:26px;font-weight:900">+</button><button>💬<br>Mensagens</button><button onclick="sair()">👤<br>Sair</button></div>
<input type="file" id="file" accept="video/*" style="display:none">

<script>
// MOSTRA CADASTRO NA HORA - SEM DEPENDER DE BANCO
function mostraLogin(){
const u=localStorage.getItem('caicara_user');
if(!u){document.getElementById('login').style.display='flex';}
else{try{const d=JSON.parse(u);document.getElementById('eu').innerText=d.usuario;document.getElementById('login').style.display='none';}catch(e){localStorage.removeItem('caicara_user');document.getElementById('login').style.display='flex';}}
}
mostraLogin();

function idadeCalc(data){
const hoje=new Date();const n=new Date(data);let i=hoje.getFullYear()-n.getFullYear();const m=hoje.getMonth()-n.getMonth();if(m<0||(m===0&&hoje.getDate()<n.getDate())) i--;return i;
}

function cadastrar(){
const nome=document.getElementById('nome').value.trim();
let usuario=document.getElementById('usuario').value.trim();
const zap=document.getElementById('zap').value.trim();
const cidade=document.getElementById('cidade').value;
const nasc=document.getElementById('nasc').value;
const check=document.getElementById('check').checked;
const erro=document.getElementById('erro');
erro.style.display='none';
if(nome.length<3){erro.innerText='Digite nome completo';erro.style.display='block';return;}
if(usuario.length<3){erro.innerText='Digite @usuário';erro.style.display='block';return;}
if(!usuario.startsWith('@')) usuario='@'+usuario;
if(zap.replace(/\D/g,'').length<10){erro.innerText='Digite Zap com DDD válido';erro.style.display='block';return;}
if(!nasc){erro.innerText='Selecione data de nascimento';erro.style.display='block';return;}
const id=idadeCalc(nasc);
if(id<18){erro.innerText='🚫 MENOR DE 18 NÃO PODE! Você tem '+id+' anos';erro.style.display='block';return;}
if(!check){erro.innerText='Marque que tem 18+';erro.style.display='block';return;}
localStorage.setItem('caicara_user',JSON.stringify({nome,usuario,zap,cidade,nasc,idade:id}));
alert('Bem-vindo '+nome+'! '+usuario+' cadastrado!');
mostraLogin(); carregarFeed();
}

function sair(){if(confirm('Sair e apagar cadastro?')){localStorage.removeItem('caicara_user');location.reload();}}

function carregarFeed(){
const u=JSON.parse(localStorage.getItem('caicara_user')||'{"usuario":"@Taki"}');
document.getElementById('feed').innerHTML=`<div class="card"><p style="font-size:50px">🌊</p><h3>Caiçara Play</h3><p style="opacity:.6;margin-top:6px">Logado como ${u.usuario}</p><p style="opacity:.6;font-size:12px">${u.nome} - ${u.cidade}</p><p style="opacity:.6;font-size:12px">Zap: ${u.zap}</p><p style="opacity:.6;font-size:11px;margin-top:8px">Idade: ${u.idade} anos ✅ +18 verificado</p><button onclick="document.getElementById('file').click()" style="margin-top:16px;background:#0080c0;color:#fff;border:none;padding:12px 24px;border-radius:20px;font-weight:900">+ Postar primeiro vídeo</button></div>`;
}
carregarFeed();

// se já tiver cadastro, já carrega
if(localStorage.getItem('caicara_user')){carregarFeed();}
</script>
</body>
</html>
