<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Caiçara Play V77 Sem Botão Feio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
html,body{height:100dvh;background:#000;color:#fff;overflow:hidden}
.loginBg{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#0d4a7a,#000);display:flex;flex-direction:column;align-items:center;padding:20px 14px;overflow-y:auto}
.box{background:#121212;border:1px solid #2a2a2a;border-radius:18px;padding:16px;width:100%;max-width:380px;margin-top:20px}
.box input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;margin-top:6px}
.btn{width:100%;background:#ff2d55;color:#fff;border:none;padding:16px;border-radius:12px;font-weight:900;margin-top:18px}
.btn-guest{width:100%;background:transparent;border:2px solid #fff;color:#fff;padding:14px;border-radius:12px;font-weight:800;margin-top:12px}
.link{color:#4da3ff;font-size:13px;text-align:center;margin-top:14px;display:block;background:none;border:none;width:100%}
.top{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;padding:0 14px;display:flex;align-items:center;gap:10px;background:#000;border-bottom:1px solid #1a1a1a}
.feed{position:fixed;top:56px;bottom:88px;left:0;right:0;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000}
.card{height:100%;width:100%;scroll-snap-align:start;position:relative;background:#0a0a0a;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.card video,.card img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
/* PLAY DISCRETO - igual TikTok, pequeno */
.centerPlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;width:70px;height:70px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.8);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:28px;color:#fff;pointer-events:none;backdrop-filter:blur(2px)}
.centerPlay.show{display:flex;animation:fadeOut 1.2s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.side{position:absolute;right:10px;bottom:100px;z-index:30;display:flex;flex-direction:column;gap:14px;align-items:center}
.sideBtn{width:56px;height:56px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
.sideBtnPlay{background:#00c950;box-shadow:0 2px 8px rgba(0,201,80,.4)}
.sideBtnStop{background:#ff2d55;box-shadow:0 2px 8px rgba(255,45,85,.4)}
.sideLabel{font-size:9px;font-weight:800;margin-top:4px;text-shadow:0 1px 3px #000;text-align:center;opacity:.9}
.followWrap{display:flex;flex-direction:column;align-items:center;position:relative}
.followPlus{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:20px;height:20px;background:#ff2d55;border:2px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff}
.followPlus.following{background:#00c950}
.info{position:absolute;left:14px;right:90px;bottom:18px;z-index:15;text-shadow:0 1px 6px #000;line-height:1.3}
.bottom{position:fixed;bottom:0;left:0;right:0;height:88px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:300;padding-bottom:10px}
.bottom button{background:none;border:none;color:#fff;font-size:11px;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.plus{width:62px;height:42px;background:#fff;color:#000;border-radius:14px;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;background:#000;z-index:400;display:none;flex-direction:column}.modal.show{display:flex}
.modalGuest{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}.modalGuest.show{display:flex}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.92);border:2px solid #ff2d55;color:#fff;padding:14px 22px;border-radius:14px;font-weight:800;z-index:600;display:none;text-align:center}.toast.show{display:flex}
.btnMore{position:absolute;top:14px;right:12px;z-index:30;width:40px;height:40px;background:rgba(0,0,0,.4);border:none;border-radius:50%;color:#fff;font-size:20px;backdrop-filter:blur(4px)}
.btnKillAudio{background:rgba(255,45,85,.9);color:#fff;border:none;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px}
.tabs{display:flex;background:#0a0a0a;border-top:1px solid #222}
.tab{flex:1;padding:12px;text-align:center;font-size:12px;font-weight:800;border-bottom:3px solid transparent;cursor:pointer;opacity:.6}
.tab.active{opacity:1;border-bottom-color:#ff2d55;background:#1a0a0f;color:#fff}
.filters{display:flex;gap:10px;padding:12px 10px;overflow-x:auto;background:#111}
.f{flex:0 0 72px;text-align:center;cursor:pointer}.f div{width:72px;height:72px;border-radius:16px;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;border:3px solid transparent;gap:2px;font-weight:800}.f.active div{border-color:#ff2d55;background:#2a0a15}
.inp{background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;width:100%}
#stickerLayer{position:absolute;top:0;left:0;right:0;height:30%;z-index:10;pointer-events:none;display:flex;justify-content:center;align-items:flex-start;padding-top:16px;gap:10px}
.sticker{font-size:52px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.emptyCard{height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(circle at 50% 30%, #1a1a1a, #000)}
.musicaTag{position:absolute;top:12px;left:12px;z-index:25;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:16px;font-size:10px;font-weight:700;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.15)}
.volRow{display:flex;align-items:center;gap:8px;background:#1a1a1a;border-radius:10px;padding:8px;margin-top:8px}
.volRow.muted{background:#2a0a0a;border:1px solid #ff2d55}
</style>
</head>

<div style="background:#1e1e1e;border-radius:16px;overflow:hidden">
<button onclick="tirarFotoAgora()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:800;border-bottom:1px solid #333">📷 FOTO</button>
<button onclick="gravarVideoAgora()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:800;border-bottom:1px solid #333">📹 VÍDEO</button>

<button onclick="document.getElementById('escolha').classList.remove('show')" style="width:100%;background:none;border:none;color:#999;padding:14px">Cancelar</button>
</div></div>
<div class="modal" id="editor">
<div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222;align-items:center"><button onclick="fecharEditor()" style="background:none;border:none;color:#fff;font-size:22px">✕</button><b id="editorTit">Editar</b><button id="btnPost" style="background:#ff2d55;border:none;color:#fff;padding:8px 16px;border-radius:20px;font-weight:900">Postar</button></div>

<span id="timer" style="background:#000;padding:6px 10px;border-radius:20px;font-size:12px">00:00</span>

</div></div>
<div id="boxAudioEdit" style="display:none;background:#0a0a0a;border-top:2px solid #ff2d55;padding:12px;max-height:68vh;overflow-y:auto">

<script>
let db,idParaDeletar=null,stream=null,recorder=null,chunks=[],recSec=0,isRecording=false,recTimer=null,tempBlob=null,tempFoto=null,currentTab='frutinha',currentFiltro=null,tempMusicaBlob=null,tempMusicaNome='',tempNarracaoBlob=null,isNarrRecording=false,narrRecorder=null,narrChunks=[];
let currentVolVideo=1, currentVolMusica=0.25, currentVolNarr=1, currentCardId=null;
const DB_NAME='caicara_v77_sem_botao_feio';const ADMIN_USER='@taki'; const ADMIN_PASS='Tete1212';
const allFiltros={frutinha:[{id:'none',nome:'Normal',icon:'☀️',filter:'none',stickers:[],emoji:''},{id:'morango',nome:'Morango',icon:'🍓',filter:'sepia(0.2) hue-rotate(-15deg) saturate(1.7)',stickers:['🍓','🍓','🍓'],emoji:'🍓'},{id:'laranja',nome:'Laranja',icon:'🍊',filter:'sepia(0.3) hue-rotate(-20deg) saturate(1.5)',stickers:['🍊','🍊','🍊'],emoji:'🍊'},{id:'limao',nome:'Limão',icon:'🍋',filter:'sepia(0.15) hue-rotate(25deg) saturate(1.4)',stickers:['🍋','🍋','🍋'],emoji:'🍋'},{id:'uva',nome:'Uva',icon:'🍇',filter:'sepia(0.25) hue-rotate(230deg) saturate(1.3)',stickers:['🍇','🍇','🍇'],emoji:'🍇'},{id:'banana',nome:'Banana',icon:'🍌',filter:'sepia(0.5) hue-rotate(15deg) saturate(1.2)',stickers:['🍌','🍌','🍌'],emoji:'🍌'},],normal:[{id:'none2',nome:'Normal',icon:'☀️',filter:'none',stickers:[],emoji:''},{id:'bronze',nome:'Bronze',icon:'☀️',filter:'sepia(0.4) saturate(1.3)',stickers:[],emoji:'☀️'},{id:'suave',nome:'Suave',icon:'✨',filter:'brightness(1.18) contrast(0.92) saturate(1.15)',stickers:[],emoji:'✨'},{id:'nitido',nome:'Nítido',icon:'💎',filter:'contrast(1.35) saturate(1.25)',stickers:[],emoji:'💎'},{id:'pb',nome:'P&B',icon:'⚫',filter:'grayscale(1)',stickers:[],emoji:'⚫'},{id:'vintage',nome:'Vintage',icon:'📼',filter:'sepia(0.75)',stickers:[],emoji:'📼'},],desenho:[{id:'none3',nome:'Normal',icon:'☀️',filter:'none',stickers:[],emoji:''},{id:'cartoon',nome:'Cartoon',icon:'🎨',filter:'contrast(1.9) saturate(2)',stickers:[],emoji:'🎨'},{id:'hq',nome:'HQ',icon:'💥',filter:'contrast(2.8) saturate(2.5)',stickers:[],emoji:'💥'},{id:'lapis',nome:'Lápis',icon:'✏️',filter:'grayscale(1) contrast(2.5)',stickers:[],emoji:'✏️'},{id:'anime',nome:'Anime',icon:'🌸',filter:'contrast(1.7) saturate(2.2)',stickers:[],emoji:'🌸'},]};
currentFiltro=allFiltros.frutinha[0];
function onVolVideoChange(v){currentVolVideo=parseFloat(v);document.getElementById('volVideoTxt').innerText=Math.round(currentVolVideo*100)+'%';const pv=document.getElementById('prevVideo');if(pv){pv.volume=currentVolVideo;pv.muted=currentVolVideo===0;}const row=document.getElementById('volVideoRow');if(currentVolVideo===0){row.classList.add('muted');toast('🔇 MUTADO');}else{row.classList.remove('muted');}}
function onVolMusicaChange(v){currentVolMusica=parseFloat(v);document.getElementById('volMusicaTxt').innerText=Math.round(currentVolMusica*100)+'%';document.getElementById('audioPreview').volume=currentVolMusica;}
function onVolNarrChange(v){currentVolNarr=parseFloat(v);document.getElementById('volNarrTxt').innerText=Math.round(currentVolNarr*100)+'%';document.getElementById('audioNarrPreview').volume=currentVolNarr;}
function setVolVideo(v){document.getElementById('volVideo').value=v;onVolVideoChange(v);}
function openDB(){return new Promise(res=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=e=>{e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true})};req.onsuccess=e=>{db=e.target.result;res()}})}
function addVideo(v){return new Promise(r=>{db.transaction('videos','readwrite').objectStore('videos').add(v).onsuccess=r})}
function getVideos(){return new Promise(r=>{try{db.transaction('videos','readonly').objectStore('videos').getAll().onsuccess=e=>r(e.target.result.reverse())}catch(e){r([])}})}
function deleteVideo(id){return new Promise(r=>{db.transaction('videos','readwrite').objectStore('videos').delete(id).onsuccess=r})}
function stopAll(showToast){
try{
document.querySelectorAll('.feed video').forEach(v=>{v.pause(); v.currentTime=0;});
document.querySelectorAll('.feed audio').forEach(a=>{a.pause(); a.currentTime=0;});
document.getElementById('audioPreview').pause(); document.getElementById('audioPreview').currentTime=0;
document.getElementById('audioNarrPreview').pause(); document.getElementById('audioNarrPreview').currentTime=0;
document.querySelectorAll('.centerPlay').forEach(b=>{b.classList.remove('show');});
currentCardId=null;
if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
}catch(e){}
if(showToast) toast('⏹️ STOP');
}
function toast(m){const t=document.getElementById('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function getUsers(){try{return JSON.parse(localStorage.getItem('caicara_users')||'[]')}catch(e){return[]}}
function saveUsers(u){localStorage.setItem('caicara_users',JSON.stringify(u))}
function idadeCalc(d){const h=new Date(),n=new Date(d);let i=h.getFullYear()-n.getFullYear(),m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))i--;return i}
function checarLogin(){const g=localStorage.getItem('caicara_guest');if(g==='true'){document.getElementById('loginScreen').style.display='none';document.getElementById('eu').innerText='👀 Visitante';return true}const raw=localStorage.getItem('caicara_user');if(!raw){document.getElementById('loginScreen').style.display='flex';return false}try{const u=JSON.parse(raw);document.getElementById('eu').innerText=u.usuario;document.getElementById('loginScreen').style.display='none';return true}catch(e){document.getElementById('loginScreen').style.display='flex';return false}}
function mostrarCadastro(){document.getElementById('boxEntrar').style.display='none';document.getElementById('boxCadastro').style.display='block'}
function mostrarLogin(){document.getElementById('boxCadastro').style.display='none';document.getElementById('boxEntrar').style.display='block'}
function cadastrar(){const nome=document.getElementById('nome').value.trim();let usuario=document.getElementById('usuario').value.trim().toLowerCase();const nasc=document.getElementById('nasc').value;const senha=document.getElementById('senha').value;const senha2=document.getElementById('senha2').value;const check=document.getElementById('check').checked;const erro=document.getElementById('erro');erro.style.display='none';if(nome.length<3||usuario.length<3){erro.innerText='Min 3 letras';erro.style.display='block';return}if(!usuario.startsWith('@'))usuario='@'+usuario;if(!nasc||idadeCalc(nasc)<18){erro.innerText='Precisa 18+';erro.style.display='block';return}if(senha.length<3||senha!==senha2){erro.innerText='Senha inválida';erro.style.display='block';return}if(!check){erro.innerText='Marque 18+';erro.style.display='block';return}let users=getUsers();if(users.find(u=>u.usuario===usuario)){erro.innerText='Já existe';erro.style.display='block';return}const novo={nome,usuario,nasc,senha};users.push(novo);saveUsers(users);localStorage.setItem('caicara_user',JSON.stringify(novo));localStorage.removeItem('caicara_guest');checarLogin();render()}
function fazerLogin(){let u=document.getElementById('loginUser').value.toLowerCase();if(!u.startsWith('@'))u='@'+u;const s=document.getElementById('loginSenha').value;let users=getUsers();if(u===ADMIN_USER.toLowerCase()&&s===ADMIN_PASS){let admin={usuario:ADMIN_USER,senha:ADMIN_PASS,nome:'Taki Admin'};users=users.filter(x=>x.usuario.toLowerCase()!==ADMIN_USER.toLowerCase());users.push(admin);saveUsers(users);localStorage.setItem('caicara_user',JSON.stringify(admin));localStorage.removeItem('caicara_guest');checarLogin();render();toast('👑 @taki!');return}let ach=users.find(x=>x.usuario.toLowerCase()==u&&x.senha==s);if(!ach){document.getElementById('erro2').innerText='Use @taki / Tete1212';document.getElementById('erro2').style.display='block';return}localStorage.setItem('caicara_user',JSON.stringify(ach));localStorage.removeItem('caicara_guest');checarLogin();render()}
function entrarComoVisitante(){localStorage.setItem('caicara_guest','true');localStorage.removeItem('caicara_user');checarLogin();render()}
function sair(){stopAll();localStorage.removeItem('caicara_user');localStorage.removeItem('caicara_guest');location.reload()}
function getSeguindo(){try{return JSON.parse(localStorage.getItem('caicara_seguindo')||'[]')}catch(e){return[]}}
function saveSeguindo(a){localStorage.setItem('caicara_seguindo',JSON.stringify(a))}
function toggleSeguir(btn,user){let lista=getSeguindo();let ja=lista.includes(user);if(ja){lista=lista.filter(u=>u!==user);toast('🚫 Deixou de seguir');btn.querySelector('.followPlus').innerText='+';btn.querySelector('.followPlus').classList.remove('following')}else{lista.push(user);toast('✅ Seguindo');btn.querySelector('.followPlus').innerText='✓';btn.querySelector('.followPlus').classList.add('following')}saveSeguindo(lista)}
function abrirMenuMais(id){idParaDeletar=id;document.getElementById('modalDel').classList.add('show')}
async function confirmarDeletar(){if(idParaDeletar!==null){stopAll();await deleteVideo(idParaDeletar);document.getElementById('modalDel').classList.remove('show');toast('🗑️ Deletado!');idParaDeletar=null;render()}}
function acaoInicio(){stopAll(true);render();}
function acaoSeguindo(){let l=getSeguindo();toast(l.length?'👥 Seguindo: '+l.join(', '):'👥 Ninguém seguido')}
function acaoMais(){stopAll();document.getElementById('escolha').classList.add('show')}
function acaoPerfil(){getVideos().then(vs=>{document.getElementById('countVideos').innerText=vs.length});document.getElementById('countSeguindo').innerText=getSeguindo().length;let u=JSON.parse(localStorage.getItem('caicara_user')||'{"usuario":"@taki"}');document.getElementById('perfilNome').innerText=u.usuario;document.getElementById('perfilLetra').innerText=(u.usuario||'@T').charAt(1).toUpperCase();document.getElementById('modalPerfil').classList.add('show')}
function abrirGaleriaDireto(){document.getElementById('escolha').classList.remove('show');setTimeout(()=>{document.getElementById('fileGaleria').click()},200)}
function tirarFotoAgora(){stopAll();document.getElementById('escolha').classList.remove('show');abrirCameraFoto()}
function gravarVideoAgora(){stopAll();document.getElementById('escolha').classList.remove('show');abrirCameraVideo()}
function setTab(tab){currentTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+tab).classList.add('active');currentFiltro=allFiltros[tab][0];montarFiltros()}
function montarFiltros(){const lista=allFiltros[currentTab]||allFiltros.frutinha;document.getElementById('filters').innerHTML=lista.map(f=>`<div class="f ${currentFiltro.id===f.id?'active':''}" onclick="setFiltro('${f.id}')"><div><span style="font-size:26px">${f.icon}</span><span>${f.nome}</span></div></div>`).join('');applyFilter()}
function setFiltro(id){const lista=allFiltros[currentTab];currentFiltro=lista.find(x=>x.id===id);document.querySelectorAll('.f').forEach((el,i)=>el.classList.toggle('active',lista[i].id===id));document.getElementById('editorTit').innerText='Caiçara Play - '+currentFiltro.nome;applyFilter()}
function applyFilter(){const v=document.getElementById('camVideo');const pv=document.getElementById('prevVideo');const pf=document.getElementById('prevFoto');const f=currentFiltro.filter||'none';if(v) v.style.filter=f;if(pv) pv.style.filter=f;if(pf) pf.style.filter=f;const layer=document.getElementById('stickerLayer');if(currentFiltro.stickers&&currentFiltro.stickers.length>0){layer.innerHTML=currentFiltro.stickers.map(s=>`<div class="sticker">${s}</div>`).join('');layer.style.display='flex'}else{layer.innerHTML='';layer.style.display='none'}}
async function startCamera(a){if(stream){stream.getTracks().forEach(t=>t.stop())}stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:a});const v=document.getElementById('camVideo');v.srcObject=stream;v.style.display='block';v.muted=true;await v.play();applyFilter()}
async function abrirCameraVideo(){document.getElementById('editor').classList.add('show');document.getElementById('camVideo').style.display='block';document.getElementById('prevVideo').style.display='none';document.getElementById('prevFoto').style.display='none';document.getElementById('recVideo').style.display='flex';document.getElementById('recFoto').style.display='none';document.getElementById('boxAudioEdit').style.display='none';currentTab='frutinha';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-frutinha').classList.add('active');currentFiltro=allFiltros.frutinha[0];montarFiltros();await startCamera(false)}
async function abrirCameraFoto(){document.getElementById('editor').classList.add('show');document.getElementById('camVideo').style.display='block';document.getElementById('prevVideo').style.display='none';document.getElementById('prevFoto').style.display='none';document.getElementById('recFoto').style.display='block';document.getElementById('recVideo').style.display='none';document.getElementById('boxAudioEdit').style.display='none';currentTab='frutinha';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-frutinha').classList.add('active');currentFiltro=allFiltros.frutinha[0];montarFiltros();await startCamera(false)}
function capturarFoto(){const video=document.getElementById('camVideo');const canvas=document.createElement('canvas');canvas.width=video.videoWidth||1280;canvas.height=video.videoHeight||720;const ctx=canvas.getContext('2d');ctx.filter=currentFiltro.filter||'none';ctx.drawImage(video,0,0,canvas.width,canvas.height);if(currentFiltro.stickers&&currentFiltro.stickers.length>0){ctx.font=(canvas.width*0.13)+'px serif';const y=canvas.height*0.18;const gap=canvas.width*0.25;currentFiltro.stickers.forEach((s,i)=>{ctx.fillText(s,gap*(i+0.5),y);});}tempFoto=canvas.toDataURL('image/jpeg',0.92);document.getElementById('prevFoto').src=tempFoto;document.getElementById('prevFoto').style.display='block';document.getElementById('camVideo').style.display='none';document.getElementById('recFoto').style.display='none';document.getElementById('stickerLayer').style.display='none';document.getElementById('boxAudioEdit').style.display='block';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function iniciarGravacao(){if(isRecording) return;await startCamera(true);chunks=[];recSec=0;recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{tempBlob=new Blob(chunks,{type:'video/webm'});const pv=document.getElementById('prevVideo');pv.src=URL.createObjectURL(tempBlob);pv.style.display='block';pv.volume=currentVolVideo;pv.muted=currentVolVideo===0;pv.play();document.getElementById('camVideo').style.display='none';document.getElementById('recVideo').style.display='none';document.getElementById('boxAudioEdit').style.display='block';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}};recorder.start();isRecording=true;document.getElementById('btnRec').innerText='Grav...';document.getElementById('btnStop').style.display='flex';recTimer=setInterval(()=>{recSec++;document.getElementById('timer').innerText='00:'+String(recSec).padStart(2,'0')},1000)}
function pararGravacao(){if(!isRecording) return;isRecording=false;recorder.stop();document.getElementById('btnRec').innerText='● REC';document.getElementById('btnStop').style.display='none';clearInterval(recTimer);}
function apagarFotoVideo(){stopAll();tempBlob=null;tempFoto=null;document.getElementById('prevVideo').style.display='none';document.getElementById('prevFoto').style.display='none';document.getElementById('camVideo').style.display='block';document.getElementById('boxAudioEdit').style.display='none';removerMusica();removerNarracao();startCamera(false)}
function fecharEditor(){stopAll();document.getElementById('editor').classList.remove('show');tempBlob=null;tempFoto=null;document.getElementById('boxAudioEdit').style.display='none';removerMusica();removerNarracao();render()}
function stopPreviewMusica(){stopAll();}
function removerMusica(){tempMusicaBlob=null;document.getElementById('musicaBox').style.display='none';document.getElementById('audioPreview').pause();document.getElementById('audioPreview').src='';}
async function toggleNarracao(){if(isNarrRecording){narrRecorder.stop();return;}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});narrChunks=[];narrRecorder=new MediaRecorder(s);narrRecorder.ondataavailable=e=>{if(e.data.size>0)narrChunks.push(e.data)};narrRecorder.onstop=()=>{tempNarracaoBlob=new Blob(narrChunks,{type:'audio/webm'});const url=URL.createObjectURL(tempNarracaoBlob);const aud=document.getElementById('audioNarrPreview');aud.src=url;aud.volume=currentVolNarr;document.getElementById('narrBox').style.display='block';document.getElementById('narrNome').innerText='gravada '+(tempNarracaoBlob.size/1000).toFixed(0)+'KB';aud.onloadedmetadata=()=>{document.getElementById('narrDur').innerText=aud.duration.toFixed(1)+'s';};document.getElementById('btnNarracao').innerText='🎙️ Regravar';document.getElementById('btnNarracao').style.background='#333';s.getTracks().forEach(t=>t.stop());isNarrRecording=false;toast('🎙️ Gravada!');if(currentVolVideo>0.3){setVolVideo(0.15);}};narrRecorder.start();isNarrRecording=true;document.getElementById('btnNarracao').innerText='⏹️ Parar';document.getElementById('btnNarracao').style.background='#ff2d55';const v=document.getElementById('prevVideo');if(v&&v.src){v.volume=currentVolVideo; v.muted=currentVolVideo===0; v.play().catch(()=>{});}}catch(e){toast('❌ Mic negado');}}
function removerNarracao(){tempNarracaoBlob=null;document.getElementById('narrBox').style.display='none';document.getElementById('btnNarracao').innerText='🎙️ Gravar narração';document.getElementById('btnNarracao').style.background='#00c950';const a=document.getElementById('audioNarrPreview');a.pause();a.src='';}
function previewCompleto(){stopAll();setTimeout(()=>{const v=document.getElementById('prevVideo');const a=document.getElementById('audioPreview');const n=document.getElementById('audioNarrPreview');if(v&&v.src){v.volume=currentVolVideo;v.muted=currentVolVideo===0;v.currentTime=0;v.play().catch(()=>{});}if(a&&a.src&&tempMusicaBlob){a.volume=currentVolMusica;a.currentTime=0;a.play().catch(()=>{});}if(n&&n.src&&tempNarracaoBlob){n.volume=currentVolNarr;n.currentTime=0;n.play().catch(()=>{});}toast('▶️ Preview limpo');},100);}
document.getElementById('fileGaleria').addEventListener('change',e=>{const f=e.target.files[0];if(!f) return;if(f.type.startsWith('image/')){const r=new FileReader();r.onload=ev=>{tempFoto=ev.target.result;tempBlob=null;document.getElementById('prevFoto').src=tempFoto;document.getElementById('prevFoto').style.display='block';document.getElementById('prevVideo').style.display='none';document.getElementById('editor').classList.add('show');document.getElementById('camVideo').style.display='none';document.getElementById('recFoto').style.display='none';document.getElementById('recVideo').style.display='none';document.getElementById('boxAudioEdit').style.display='block';montarFiltros()};r.readAsDataURL(f)}else{tempBlob=f;tempFoto=null;const pv=document.getElementById('prevVideo');pv.src=URL.createObjectURL(f);pv.style.display='block';pv.volume=currentVolVideo;pv.muted=currentVolVideo===0;pv.play();document.getElementById('editor').classList.add('show');document.getElementById('camVideo').style.display='none';document.getElementById('boxAudioEdit').style.display='block';montarFiltros()}});
document.getElementById('fileMusica').addEventListener('change',e=>{const f=e.target.files[0];if(!f) return;tempMusicaBlob=f;const url=URL.createObjectURL(f);const ap=document.getElementById('audioPreview');ap.src=url;ap.volume=currentVolMusica;document.getElementById('musicaBox').style.display='block';document.getElementById('nomeMusica').innerText=f.name;toast('🎵 Música ok');});
function playCard(card){
const cardId=card.dataset.id;
if(currentCardId===cardId){
const v=card.querySelector('video');
if(v &&!v.paused) return;
}
stopAll();
const v=card.querySelector('video');
const audio=card.querySelector('audio.musicaFundo');
const narr=card.querySelector('audio.narrFundo');
if(!v) return;
const volV=parseFloat(card.dataset.volVideo||1);
v.volume=volV; v.muted=volV===0;
if(v.currentTime>=v.duration-0.05) v.currentTime=0;
v.play().then(()=>{
if(audio){audio.volume=parseFloat(card.dataset.volMusica||0.25); audio.currentTime=0; audio.play().catch(()=>{});}
if(narr){narr.volume=parseFloat(card.dataset.volNarr||1); narr.currentTime=0; narr.play().catch(()=>{});}
currentCardId=cardId;
}).catch(()=>{});
}
function stopCard(card){
const v=card.querySelector('video');
const audio=card.querySelector('audio.musicaFundo');
const narr=card.querySelector('audio.narrFundo');
if(v){v.pause(); v.currentTime=0;}
if(audio){audio.pause(); audio.currentTime=0;}
if(narr){narr.pause(); narr.currentTime=0;}
currentCardId=null;
}
function handleCardTap(card){
const v=card.querySelector('video');
if(!v) return;
if(v.paused){
playCard(card);
}else{
// mostra play discreto por 1s e pausa
const icon=card.querySelector('.centerPlay');
if(icon){icon.innerText='⏸️'; icon.classList.add('show'); setTimeout(()=>icon.classList.remove('show'),1000);}
v.pause();
const a=card.querySelector('audio.musicaFundo'); if(a) a.pause();
const n=card.querySelector('audio.narrFundo'); if(n) n.pause();
}
}
async function render(){
const vids=await getVideos();
const feed=document.getElementById('feed');
const seguindo=getSeguindo();
if(!vids.length){feed.innerHTML=`<div class="emptyCard"><div style="font-size:64px">✨</div><div style="font-size:22px;font-weight:900;margin-top:12px">V77 Limpo</div><div style="font-size:13px;opacity:.7;margin-top:8px;text-align:center">Sem botão feio no meio<br>Toque no vídeo pra pausar</div><button onclick="acaoMais()" style="margin-top:22px;background:#ff2d55;color:#fff;border:none;padding:14px 28px;border-radius:24px;font-weight:900">+ Postar vídeo</button></div>`;return}
feed.innerHTML=vids.map(v=>{
const url=v.blob?URL.createObjectURL(v.blob):v.fotoData;
const isFoto=v.type==='foto'||v.fotoData;
const media=isFoto?`<img src="${url}">`:`<video playsinline preload="metadata" src="${url}" onended="stopCard(this.closest('.card'))"></video>`;
let musicaHtml=''; let narrHtml=''; let badge='';
if(v.musicaBlob){const mUrl=URL.createObjectURL(v.musicaBlob);musicaHtml=`<audio class="musicaFundo" src="${mUrl}"></audio>`;}
if(v.narracaoBlob){const nUrl=URL.createObjectURL(v.narracaoBlob);narrHtml=`<audio class="narrFundo" src="${nUrl}"></audio>`;}
const volV=v.volVideo!=null?v.volVideo:1;
const volM=v.volMusica!=null?v.volMusica:0.25;
const volN=v.volNarr!=null?v.volNarr:1;
let badgeTxt='';if(volV===0) badgeTxt+='🔇 ';if(v.musicaBlob) badgeTxt+='🎵';if(v.narracaoBlob) badgeTxt+='🎙️';
if(badgeTxt) badge=`<div class="musicaTag">${badgeTxt}</div>`;
const user=v.user||'@taki';const jaSegue=seguindo.includes(user);
return `<div class="card" data-id="${v.id}" data-vol-video="${volV}" data-vol-musica="${volM}" data-vol-narr="${volN}" onclick="handleCardTap(this)">${badge}${musicaHtml}${narrHtml}<button class="btnMore" onclick="event.stopPropagation();abrirMenuMais(${v.id})">⋯</button>${media}<div class="centerPlay">▶️</div><div class="side"><div class="followWrap"><button class="sideBtn" onclick="event.stopPropagation();toggleSeguir(this,'${user}')" style="background:#fff;color:#000;font-weight:900">${user.charAt(1)?user.charAt(1).toUpperCase():'T'}</button><div class="followPlus ${jaSegue?'following':''}">${jaSegue?'✓':'+'}</div></div><div style="display:flex;flex-direction:column;align-items:center"><button class="sideBtn sideBtnPlay" onclick="event.stopPropagation();playCard(this.closest('.card'))">▶️</button><div class="sideLabel" style="color:#00c950">PLAY</div></div><div style="display:flex;flex-direction:column;align-items:center"><button class="sideBtn sideBtnStop" onclick="event.stopPropagation();stopCard(this.closest('.card'))">⏹️</button><div class="sideLabel" style="color:#ff6b6b">STOP</div></div><div style="display:flex;flex-direction:column;align-items:center"><button class="sideBtn" onclick="event.stopPropagation();abrirMenuMais(${v.id})">🗑️</button><div class="sideLabel">Del</div></div></div><div class="info"><b>${user}</b><div>${v.emoji||''} ${v.desc||''}</div></div></div>`}).join('');
}
document.getElementById('btnPost').onclick=async()=>{const desc=document.getElementById('leg').value||'Vídeo '+(currentFiltro?currentFiltro.nome:'');if(!tempBlob&&!tempFoto){alert('Grave ou escolha da galeria');return}stopAll();let u=JSON.parse(localStorage.getItem('caicara_user')||'{"usuario":"@taki"}');const videoData={desc,emoji:currentFiltro.emoji,user:u.usuario,musicaBlob:tempMusicaBlob,musicaNome:tempMusicaNome,volVideo:currentVolVideo,volMusica:currentVolMusica,volNarr:currentVolNarr,narracaoBlob:tempNarracaoBlob};if(tempFoto){videoData.fotoData=tempFoto;videoData.type='foto'}else{videoData.blob=tempBlob;videoData.type='video'}await addVideo(videoData);fecharEditor();tempBlob=null;tempFoto=null;tempMusicaBlob=null;tempMusicaNome='';tempNarracaoBlob=null;currentVolVideo=1;document.getElementById('volVideo').value=1;document.getElementById('volVideoTxt').innerText='100%';document.getElementById('volVideoRow').classList.remove('muted');document.getElementById('musicaBox').style.display='none';document.getElementById('narrBox').style.display='none';toast('🚀 Postado limpo!');};
openDB().then(()=>{let users=getUsers();if(users.length===0||!users.find(x=>x.usuario==='@taki')){users=users.filter(x=>x.usuario!=='@taki');users.push({usuario:ADMIN_USER,senha:ADMIN_PASS,nome:'Taki Admin'});saveUsers(users);}checarLogin();montarFiltros();render();});
</script>
