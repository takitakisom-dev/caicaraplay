<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caiçara Play</title>
<meta name="theme-color" content="#0080c0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;height:100dvh;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:40;padding:10px 12px;display:flex;gap:14px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);align-items:center}
.top button{border:none;background:none;color:#aaa;font-weight:700;font-size:15px}.top button.active{color:#fff;border-bottom:2px solid #fff}
.live{background:#ff2d55;color:#fff;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:900;border:none}
.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100dvh;width:100vw;scroll-snap-align:start;position:relative;background:#111;overflow:hidden}
.card video,.card img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.tap{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center}
.ico{font-size:70px;opacity:0;transition:.2s;pointer-events:none;text-shadow:0 0 10px #000}.ico.show{opacity:1}
.side{position:absolute;right:8px;bottom:130px;z-index:10;display:flex;flex-direction:column;gap:16px;align-items:center}
.side button{width:52px;height:52px;border-radius:50%;border:none;background:rgba(255,255,255,.28);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.info{position:absolute;left:12px;right:90px;bottom:90px;z-index:10}
.follow{margin-left:8px;background:#fff;color:#000;border:none;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:900}
.follow.ok{background:#333;color:#fff;border:1px solid #555}
.bottom{position:fixed;bottom:0;left:0;right:0;height:72px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bottom button{background:none;border:none;color:#fff;font-size:11px;opacity:.7;flex:1;display:flex;flex-direction:column;align-items:center}.bottom button.active{opacity:1}
.plus{width:56px;height:36px;background:#fff;color:#000;border-radius:12px;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center}
.loginBg{position:fixed;inset:0;z-index:99999;background:linear-gradient(180deg,#003a6b,#000);display:flex;flex-direction:column;align-items:center;padding:18px;overflow-y:auto}
.box{background:#111;border:1px solid #222;border-radius:20px;padding:18px;width:100%;max-width:390px;margin-top:10px}
.box input,.box select{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;margin-top:6px;font-size:15px}
.box label{font-size:10px;opacity:.6;margin-top:10px;display:block}
#erro{color:#ff4444;font-size:12px;margin-top:8px;display:none;background:#2a0000;padding:8px;border-radius:8px}
.btn{width:100%;background:#0080c0;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;margin-top:14px;font-size:16px}
.modal{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}.modal.show{display:flex}
.filters{display:flex;gap:10px;padding:10px;overflow-x:auto;background:#0a0a0a;border-top:1px solid #222}.f{flex:0 0 62px;text-align:center}.f div{width:62px;height:62px;border-radius:12px;background:#222;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid transparent}.f.active div{border-color:#0080c0}
.songs{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#111;border-top:1px solid #222}.song{flex:0 0 115px;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:8px}.song.active{border-color:#0080c0;background:#001a2a}.song b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song span{font-size:10px;opacity:.6}
.musicBadge{position:absolute;left:12px;bottom:160px;background:rgba(0,0,0,.65);padding:6px 10px;border-radius:20px;font-size:11px;z-index:10}
.grid{padding:70px 2px 80px 2px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;overflow-y:auto;height:100dvh}
#fileGaleria,#fileFoto{display:none}
</style>
</head>
<body>

<div id="login" class="loginBg" style="display:flex">
<div style="font-size:60px">🌊</div>
<h2>Caiçara Play</h2>
<p style="opacity:.7;font-size:13px;margin-top:4px">Cadastro obrigatório - Só +18</p>
<div class="box">
<label>NOME COMPLETO</label><input id="nome" placeholder="Ex: João Silva">
<label>USUÁRIO</label><input id="usuario" placeholder="@joao">
<label>ZAP COM DDD</label><input id="zap" placeholder="(12) 99999-9999" inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'').replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2')">
<label>CIDADE</label><select id="cidade"><option>Caraguatatuba</option><option>Ubatuba</option><option>São Sebastião</option><option>Ilhabela</option><option>Paraty</option></select>
<label>DATA NASCIMENTO</label><input id="nasc" type="date">
<div style="display:flex;gap:8px;margin-top:12px"><input type="checkbox" id="check" style="width:18px"><label style="margin:0;font-size:12px">Confirmo 18+ anos. Menor de 18 NÃO PODE.</label></div>
<div id="erro"></div><button class="btn" onclick="cadastrar()">Criar minha conta 🚀</button>
</div>
</div>

<input type="file" id="fileGaleria" accept="video/*"><input type="file" id="fileFoto" accept="image/*">
<div class="top"><button class="live">🔴 LIVE</button><button class="active">Para você</button><button onclick="showGrid()">Galeria</button><span id="eu" style="margin-left:auto;font-size:11px;opacity:.8"></span></div>
<div class="feed" id="feed"></div><div class="grid" id="grid" style="display:none"></div>
<div class="bottom"><button class="active" onclick="showFeed()">⌂<br>Início</button><button onclick="alert('Em breve lista de seguindo')">👥<br>Seguindo</button><button onclick="abrirEscolha()"><div class="plus">+</div></button><button onclick="showGrid()">💬<br>Galeria</button><button onclick="sair()">👤<br>Sair</button></div>

<div class="modal" id="escolha" style="background:rgba(0,0,0,.85);justify-content:flex-end;padding:16px"><div style="background:#1e1e1e;border-radius:16px;overflow:hidden"><button onclick="abrirGaleria()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700;border-bottom:1px solid #333">📁 Vídeo da Galeria (10 min)</button><button onclick="abrirFoto()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700;border-bottom:1px solid #333">🖼️ Foto com música</button><button onclick="abrirCamera()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700">📷 Gravar com Câmera</button><button onclick="document.getElementById('escolha').classList.remove('show')" style="width:100%;background:none;border:none;color:#999;padding:14px">Cancelar</button></div></div>

<div class="modal" id="editor"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #222"><button onclick="fecharEditor()" style="background:none;border:none;color:#fff;font-size:22px">✕</button><b id="editTit">Editar</b><button id="btnPost" style="background:#0080c0;border:none;color:#fff;padding:8px 16px;border-radius:20px;font-weight:900">Postar</button></div><div style="flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden"><video id="prevVideo" loop playsinline style="width:100%;height:100%;object-fit:cover;display:none"></video><img id="prevFoto" style="display:none;width:100%;height:100%;object-fit:cover"><video id="camVideo" autoplay muted playsinline style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;z-index:10;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);padding:12px"><button onclick="document.getElementById('fileGaleria').click()" style="background:#222;color:#fff;border:1px solid #444;padding:8px 12px;border-radius:20px;font-size:12px">📁 Arquivo</button><button id="btnRec" onclick="toggleRec()" style="width:66px;height:66px;border-radius:50%;background:#ff2d55;border:4px solid #fff"></button><button onclick="document.getElementById('fileFoto').click()" style="background:#222;color:#fff;border:1px solid #444;padding:8px 12px;border-radius:20px;font-size:12px">🖼️ Foto</button><span id="timer" style="background:#000;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:900">00:00 / 10:00</span></div></div><div class="filters" id="filters"></div><div class="songs" id="songs"></div><div style="padding:10px;background:#000;display:flex;gap:8px"><input id="leg" placeholder="Legenda... Ex: Praia brava hoje 🌊" style="flex:1;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:10px"><select id="cityPost" style="background:#111;color:#fff;border:1px solid #333;border-radius:10px;padding:8px"><option>Caraguá</option><option>Ubatuba</option><option>São Seba</option><option>Ilhabela</option></select></div></div>

<script>
let db; const DB_NAME='caicara_v24';
function openDB(){return new Promise(res=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('videos')) d.createObjectStore('videos',{keyPath:'id',autoIncrement:true});};req.onsuccess=e=>{db=e.target.result;res();};req.onerror=()=>res();});}
function addVideo(v){return new Promise(r=>{const tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(v).onsuccess=r;});}
function getVideos(){return new Promise(r=>{try{const tx=db.transaction('videos','readonly');tx.objectStore('videos').getAll().onsuccess=e=>r(e.target.result.reverse());}catch(e){r([]);}});}

function idadeCalc(d){const hoje=new Date();const n=new Date(d);let i=hoje.getFullYear()-n.getFullYear();const m=hoje.getMonth()-n.getMonth();if(m<0||(m===0&&hoje.getDate()<n.getDate())) i--;return i;}
function checarLogin(){
const raw=localStorage.getItem('caicara_user');
if(!raw){document.getElementById('login').style.display='flex';return false;}
try{const d=JSON.parse(raw);document.getElementById('eu').innerText=d.usuario;document.getElementById('login').style.display='none';return true;}catch(e){document.getElementById('login').style.display='flex';return false;}
}
function cadastrar(){
const nome=document.getElementById('nome').value.trim();
let usuario=document.getElementById('usuario').value.trim();
const zap=document.getElementById('zap').value.trim();
const cidade=document.getElementById('cidade').value;
const nasc=document.getElementById('nasc').value;
const check=document.getElementById('check').checked;
const erro=document.getElementById('erro');erro.style.display='none';
if(nome.length<3){erro.innerText='Digite nome completo';erro.style.display='block';return;}
if(usuario.length<3){erro.innerText='Digite @usuário';erro.style.display='block';return;}
if(!usuario.startsWith('@')) usuario='@'+usuario;
if(zap.replace(/\D/g,'').length<10){erro.innerText='Zap com DDD inválido';erro.style.display='block';return;}
if(!nasc){erro.innerText='Selecione nascimento';erro.style.display='block';return;}
const id=idadeCalc(nasc);if(id<18){erro.innerText='🚫 MENOR DE 18 NÃO PODE! Você tem '+id+' anos';erro.style.display='block';return;}
if(!check){erro.innerText='Marque 18+';erro.style.display='block';return;}
localStorage.setItem('caicara_user',JSON.stringify({nome,usuario,zap,cidade,nasc,idade:id}));
checarLogin();render();
}
function sair(){if(confirm('Sair?')){localStorage.removeItem('caicara_user');location.reload();}}

// FILTROS E MÚSICAS VOLTARAM
const filtros=[{id:'none',nome:'Normal',css:'none'},{id:'bw',nome:'P&B',css:'grayscale(1)'},{id:'sepia',nome:'Retrô',css:'sepia(1)'},{id:'vivid',nome:'Vivid',css:'saturate(2) contrast(1.2)'},{id:'praia',nome:'Praia',css:'saturate(1.4) brightness(1.1)'}];
const musicas=[{id:'none',nome:'Sem música',artista:'Original',url:''},{id:'mar',nome:'Mar Calmo',artista:'Lo-fi',url:'https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3'},{id:'funk',nome:'Funk Litoral',artista:'DJ',url:'https://cdn.pixabay.com/download/audio/2022/06/07/audio_b9bd4170e8.mp3'},{id:'custom',nome:'📁 Minha música',artista:'Do celular',url:'',custom:true}];
let filterCSS='none',selectedSong='none',songAudio=null,customUrl=null,customNome='';
let tempBlob=null,tempFoto=null,stream=null,recorder=null,chunks=[],recSec=0,isRecording=false,recTimer=null;

function montarFiltros(){
document.getElementById('filters').innerHTML=filtros.map(f=>`<div class="f ${f.css===filterCSS?'active':''}" onclick="setFiltro('${f.id}')"><div style="filter:${f.css}">${f.nome}</div><div style="font-size:10px;margin-top:4px">${f.nome}</div></div>`).join('');
document.getElementById('songs').innerHTML=musicas.map(m=>`<div class="song ${selectedSong===m.id?'active':''}" onclick="setMusica('${m.id}')"><b>${m.nome}</b><span>${m.artista}</span><div style="font-size:18px;margin-top:4px">${m.id==='none'?'🔇':m.id==='custom'?'📁':'🎵'}</div></div>`).join('');
}
function setFiltro(id){const f=filtros.find(x=>x.id===id);filterCSS=f.css;document.getElementById('prevVideo').style.filter=f.css;document.getElementById('prevFoto').style.filter=f.css;document.getElementById('camVideo').style.filter=f.css;document.querySelectorAll('.f').forEach((el,i)=>el.classList.toggle('active',filtros[i].id===id));}
function setMusica(id){
selectedSong=id;document.querySelectorAll('.song').forEach((el,i)=>el.classList.toggle('active',musicas[i].id===id));
if(songAudio){songAudio.pause();songAudio=null;}
if(id==='custom'){const inp=document.createElement('input');inp.type='file';inp.accept='audio/*';inp.onchange=e=>{const file=e.target.files[0];if(!file) return;customNome=file.name.slice(0,18);customUrl=URL.createObjectURL(file);songAudio=new Audio(customUrl);songAudio.loop=true;songAudio.play().catch(()=>{});document.getElementById('editTit').innerText='🎵 '+customNome;};inp.click();return;}
const m=musicas.find(x=>x.id===id);if(m&&m.url){songAudio=new Audio(m.url);songAudio.loop=true;songAudio.play().catch(()=>{});document.getElementById('editTit').innerText='🎵 '+m.nome;}else{document.getElementById('editTit').innerText='Sem música';}
}

function abrirEscolha(){document.getElementById('escolha').classList.add('show');}
function abrirGaleria(){document.getElementById('escolha').classList.remove('show');document.getElementById('fileGaleria').click();}
function abrirFoto(){document.getElementById('escolha').classList.remove('show');document.getElementById('fileFoto').click();}
async function abrirCamera(){document.getElementById('escolha').classList.remove('show');document.getElementById('editor').classList.add('show');document.getElementById('camVideo').style.display='block';document.getElementById('prevVideo').style.display='none';document.getElementById('prevFoto').style.display='none';montarFiltros();try{if(stream) stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});document.getElementById('camVideo').srcObject=stream;recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};recorder.onstop=()=>{tempBlob=new Blob(chunks,{type:'video/webm'});tempFoto=null;document.getElementById('prevVideo').src=URL.createObjectURL(tempBlob);document.getElementById('prevVideo').style.display='block';document.getElementById('camVideo').style.display='none';document.getElementById('prevVideo').play();};}catch{alert('Libera câmera');}}
function toggleRec(){if(!recorder){abrirCamera();return;}if(!isRecording){chunks=[];recSec=0;isRecording=true;recorder.start(100);document.getElementById('btnRec').style.background='#fff';recTimer=setInterval(()=>{recSec++;document.getElementById('timer').innerText=String(Math.floor(recSec/60)).padStart(2,'0')+':'+String(recSec%60).padStart(2,'0')+' / 10:00';if(recSec>=600) toggleRec();},1000);}else{isRecording=false;recorder.stop();document.getElementById('btnRec').style.background='#ff2d55';clearInterval(recTimer);}}

document.getElementById('fileGaleria').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;tempBlob=f;tempFoto=null;document.getElementById('prevVideo').src=URL.createObjectURL(f);document.getElementById('prevVideo').style.display='block';document.getElementById('prevFoto').style.display='none';document.getElementById('camVideo').style.display='none';document.getElementById('prevVideo').play();document.getElementById('editor').classList.add('show');montarFiltros();});
document.getElementById('fileFoto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{tempFoto=ev.target.result;tempBlob=null;document.getElementById('prevFoto').src=tempFoto;document.getElementById('prevFoto').style.display='block';document.getElementById('prevVideo').style.display='none';document.getElementById('camVideo').style.display='none';document.getElementById('editor').classList.add('show');montarFiltros();document.getElementById('editTit').innerText='Foto com música (8s)';};r.readAsDataURL(f);});
function fecharEditor(){document.getElementById('editor').classList.remove('show');document.getElementById('camVideo').style.display='none';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}if(recorder&&recorder.state!=='inactive') recorder.stop();clearInterval(recTimer);isRecording=false;if(songAudio){songAudio.pause();songAudio=null;}}

function togglePlay(card){const v=card.querySelector('video');const ic=card.querySelector('.ico');if(!v) return;if(v.paused){v.play();ic.classList.remove('show');}else{v.pause();ic.innerText='⏸️';ic.classList.add('show');setTimeout(()=>ic.classList.remove('show'),800);}}
async function sharePost(t){const d={title:'Caiçara Play 🌊',text:t,url:location.href};if(navigator.share){try{await navigator.share(d);return;}catch{}}try{await navigator.clipboard.writeText(location.href);alert('Link copiado! 📋');}catch{alert(location.href);}}
async function curtir(btn,id){const tx=db.transaction('videos','readwrite');const s=tx.objectStore('videos');s.get(id).onsuccess=e=>{const v=e.target.result;if(!v) return;v.liked=!v.liked;v.likes=(v.likes||0)+(v.liked?1:-1);if(v.likes<0) v.likes=0; s.put(v);btn.innerText=v.liked?'❤️':'🤍';btn.nextElementSibling.innerText=v.likes;};}

function showFeed(){document.getElementById('feed').style.display='block';document.getElementById('grid').style.display='none';render();}
function showGrid(){document.getElementById('feed').style.display='none';document.getElementById('grid').style.display='grid';render();}
function setupObserver(){const opt={root:document.getElementById('feed'),threshold:0.6};const obs=new IntersectionObserver(es=>{es.forEach(en=>{const v=en.target.querySelector('video');if(en.isIntersecting){document.querySelectorAll('#feed video').forEach(x=>{if(x!==v) x.pause();});if(v){v.muted=false;v.play().catch(()=>{});} }else{if(v) v.pause();}});},opt);document.querySelectorAll('.card').forEach(c=>obs.observe(c));}

async function render(){
const vids=await getVideos();const feed=document.getElementById('feed');const grid=document.getElementById('grid');
if(!vids.length){feed.innerHTML=`<div class="card" style="display:flex;align-items:center;justify-content:center;flex-direction:column"><p style="font-size:50px">🌊</p><p style="font-weight:900;margin-top:10px">Caiçara Play</p><p style="opacity:.6;font-size:12px">Logado como ${JSON.parse(localStorage.getItem('caicara_user')||'{}').usuario||''}</p><button onclick="abrirEscolha()" style="margin-top:16px;background:#0080c0;color:#fff;border:none;padding:12px 24px;border-radius:20px;font-weight:900">+ Postar</button></div>`;grid.innerHTML='';return;}
feed.innerHTML=vids.map(v=>{const media=v.type==='foto'?`<img src="${v.fotoData}" style="filter:${v.filter||'none'}">`:`<video loop playsinline src="${URL.createObjectURL(v.blob)}" style="filter:${v.filter||'none'}" muted></video>`;const badge=v.songNome?`<div class="musicBadge">🎵 ${v.songNome}</div>`:'';return `<div class="card" onclick="togglePlay(this)"><div class="tap"><div class="ico">▶️</div></div>${media}${badge}<div class="side"><div style="display:flex;flex-direction:column;align-items:center"><button onclick="event.stopPropagation();curtir(this,${v.id})">${v.liked?'❤️':'🤍'}</button><span style="font-size:11px">${v.likes||0}</span></div><button onclick="event.stopPropagation();sharePost('${(v.desc||'').replace(/'/g,'')}')">↗️</button></div><div class="info"><div style="display:flex;align-items:center"><b>${v.user}</b><button class="follow" onclick="event.stopPropagation();this.innerText=this.innerText==='Seguir'?'Seguindo':'Seguir';this.classList.toggle('ok')">Seguir</button><span style="margin-left:6px;background:#0080c0;color:#fff;font-size:10px;padding:2px 6px;border-radius:8px">${v.local}</span></div><div style="font-size:13px;margin-top:4px">${v.desc}</div></div></div>`;}).join('');
grid.innerHTML=vids.map(v=>v.type==='foto'?`<img src="${v.fotoData}" style="width:100%;aspect-ratio:9/16;object-fit:cover;background:#111">`:`<video src="${URL.createObjectURL(v.blob)}" muted loop style="width:100%;aspect-ratio:9/16;object-fit:cover;background:#111"></video>`).join('');
setTimeout(setupObserver,300);
}

document.getElementById('btnPost').onclick=async()=>{
const me=JSON.parse(localStorage.getItem('caicara_user')||'{"usuario":"@Taki"}');
const desc=document.getElementById('leg').value||'Segue aí 🌊';const city=document.getElementById('cityPost').value;
if(!tempBlob&&!tempFoto){alert('Escolhe vídeo ou foto');return;}
const song=musicas.find(m=>m.id===selectedSong);
let finalSongUrl= song&&song.custom?customUrl:(song?song.url:'');
let finalSongNome= song&&song.custom?customNome:(song&&song.id!=='none'?song.nome:'');
document.getElementById('btnPost').innerText='Salvando...';
if(tempFoto){await addVideo({user:me.usuario,local:city,desc,type:'foto',fotoData:tempFoto,filter:filterCSS,songNome:finalSongNome,songUrl:finalSongUrl,likes:0,liked:false});}
else{await addVideo({user:me.usuario,local:city,desc,type:'video',blob:tempBlob,filter:filterCSS,songNome:finalSongNome,songUrl:finalSongUrl,likes:0,liked:false});}
fecharEditor();tempBlob=null;tempFoto=null;filterCSS='none';selectedSong='none';customUrl=null;document.getElementById('leg').value='';document.getElementById('btnPost').innerText='Postar';showFeed();
};

openDB().then(()=>{checarLogin();render();});
</script>
</body>
</html>
