<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caiçara Play</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#000;color:#fff;overflow:hidden}
.top-tabs{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;gap:14px;padding:12px 12px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);overflow-x:auto;align-items:center}
.top-tabs button{background:none;border:none;color:#aaa;font-weight:700;font-size:15px;white-space:nowrap}
.top-tabs button.active{color:#fff;border-bottom:2px solid #fff;padding-bottom:2px}
.top-tabs.live{background:#ff3b30;color:#fff;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:900}
.chips{position:fixed;top:44px;left:0;right:0;z-index:15;display:flex;gap:8px;padding:6px 12px;overflow-x:auto}
.chip{background:rgba(255,255,255,.18);border:none;color:#fff;padding:6px 12px;border-radius:16px;font-size:12px}
.chip.active{background:#fff;color:#000}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;padding-top:0}
.card{height:100vh;width:100vw;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center}
.card video{width:100%;height:100%;object-fit:cover}
.tap{position:absolute;inset:0;z-index:2}
.side{position:absolute;right:8px;bottom:88px;z-index:10;display:flex;flex-direction:column;gap:16px;align-items:center}
.icon{width:48px;height:48px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;border:none;color:#fff}
.side b{font-size:13px}
.info{position:absolute;bottom:82px;left:12px;right:76px;z-index:5}
.vol{position:absolute;top:80px;right:12px;z-index:11;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;opacity:0;transition:.2s;z-index:6;pointer-events:none}
.center.show{opacity:1}
.bottom{position:fixed;bottom:0;left:0;right:0;height:76px;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center;z-index:30}
.bottom button{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;opacity:.7}
.bottom button.active{opacity:1}
.bottom.plus{width:46px;height:32px;background:#fff;color:#000;border-radius:8px;font-size:26px;font-weight:900;position:relative;border:2px solid #000}
.bottom.plus::before{content:'';position:absolute;inset:0;transform:translate(-3px,0);background:#00f2ea;border-radius:8px;z-index:-1}
.bottom.plus::after{content:'';position:absolute;inset:0;transform:translate(3px,0);background:#ff0050;border-radius:8px;z-index:-1}
.badge{background:#ff3b30;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;position:absolute;top:-6px;right:8px;font-weight:900}
#file{display:none}
.modal{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
.modal.show{display:flex}
.edit-top{display:flex;justify-content:space-between;padding:14px;background:#000}
.filters{display:flex;gap:10px;padding:12px;overflow-x:auto;border-top:1px solid #222;border-bottom:1px solid #222}
.f{flex:0 0 62px;text-align:center}
.f div{width:62px;height:62px;border-radius:12px;background:#222;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid transparent}
.f.active div{border-color:#fb923c}
.musics{display:flex;flex-direction:column;gap:8px;padding:12px;max-height:180px;overflow-y:auto}
.music{padding:10px;background:#111;border-radius:10px;display:flex;justify-content:space-between;border:1px solid #222}
.music.active{border-color:#fb923c;background:#1a1200}
.preview{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
.preview video{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<input type="file" id="file" accept="video/*">

<div class="top-tabs" id="topTabs">
<button class="live">LIVE</button>
<button>Novela</button>
<button>Seguindo</button>
<button>Loja</button>
<button class="active">Para você</button>
<button style="margin-left:auto">🔍</button>
</div>

<div class="chips" id="chips"></div>
<div class="feed" id="feed"></div>

<div class="bottom">
<button class="active" id="b-home" onclick="nav('home')"><span style="font-size:22px">⌂</span><span>Início</span></button>
<button id="b-amigos" onclick="nav('amigos')"><span style="font-size:22px">👥</span><span>Amigos</span></button>
<button onclick="document.getElementById('file').click()"><div class="plus">+</div></button>
<button id="b-msg" onclick="nav('msg')"><div style="position:relative"><span style="font-size:22px">💬</span><span class="badge">99+</span></div><span>Mensagens</span></button>
<button id="b-perfil" onclick="nav('perfil')"><span style="font-size:22px">👤</span><span>Perfil</span></button>
</div>

<!-- EDITOR -->
<div class="modal" id="editor">
<div class="edit-top"><button onclick="document.getElementById('editor').classList.remove('show')" style="background:none;border:none;color:#fff">✕</button><b>Editar</b><button id="btnPost" style="background:#fb923c;border:none;color:#000;padding:8px 16px;border-radius:20px;font-weight:900">Postar</button></div>
<div class="preview"><video id="prevVideo" loop playsinline muted></video></div>
<div class="filters" id="filters"></div>
<div style="padding:10px 12px 0"><b style="font-size:13px">🎵 Adicionar música (igual TikTok)</b></div>
<div class="musics" id="musics"></div>
<div style="padding:10px 12px 12px;display:flex;gap:8px">
<input id="leg" placeholder="Legenda..." style="flex:1;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:10px">
<select id="city" style="background:#111;color:#fff;border:1px solid #333;border-radius:10px;padding:8px"><option>Caraguá</option><option>Ubatuba</option><option>São Seba</option><option>Ilhabela</option></select>
</div>
</div>

<div id="pages" style="position:fixed;inset:0;background:#000;z-index:20;display:none;padding:70px 16px 90px;overflow:auto"></div>

<script>
let som=true, blob=null, filter='none', musica=null, audioEl=new Audio(), videos=[];
try{const s=localStorage.getItem('caicara_v9'); if(s) videos=JSON.parse(s);}catch(e){}
const filtros=[
 {id:'none',nome:'Normal',css:'none'},
 {id:'bw',nome:'P&B',css:'grayscale(1)'},
 {id:'sepia',nome:'Retrô',css:'sepia(1)'},
 {id:'vivid',nome:'Vivid',css:'saturate(2) contrast(1.2)'},
 {id:'praia',nome:'Praia',css:'saturate(1.4) brightness(1.1) hue-rotate(-10deg)'},
 {id:'sunset',nome:'Sunset',css:'sepia(.3) saturate(1.6) hue-rotate(-15deg)'},
 {id:'noite',nome:'Noite',css:'brightness(0.8) contrast(1.3) saturate(1.5)'}
];
const musicas=[
 {id:'none',nome:'Sem música',autor:'Original'},
 {id:'m1',nome:'Funk Caiçara - Maresia',autor:'DJ Litoral',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
 {id:'m2',nome:'Pagode da Praia',autor:'Grupo Caraguá',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'},
 {id:'m3',nome:'Reggae Litoral',autor:'Vibes Ubatuba',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3'},
 {id:'m4',nome:'Forró do Ilhabela',autor:'Trio Caiçara',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3'}
];
const proib=["porn","xxx","onlyfans","arma","pistola","fuzil","assalto","roubo","sangue","morte","matar"];
function temProib(t){return proib.some(p=>t.toLowerCase().includes(p));}

let aba="Todos"; const cidades=["Todos","Caraguá","Ubatuba","São Seba","Ilhabela"];
function renderChips(){document.getElementById('chips').innerHTML=cidades.map(c=>`<button class="chip ${c===aba?'active':''}" onclick="aba='${c}';renderChips();renderFeed()">${c}</button>`).join('');}
function renderFeed(){
 const f=document.getElementById('feed');
 const lista=aba==="Todos"?videos:videos.filter(v=>v.local.includes(aba));
 if(!lista.length){f.innerHTML=`<div class="card"><p style="opacity:.6">Posta o primeiro de ${aba} 🌊</p></div>`;return;}
 f.innerHTML=lista.map((v,i)=>`
 <div class="card">
 <video loop playsinline src="${v.src}" style="filter:${v.filter||'none'}" ${som?'':'muted'}></video>
 <div class="tap" onclick="toggle(this)"></div>
 <button class="vol" onclick="toggleSom()">${som?'🔊':'🔇'}</button>
 <div class="center">⏸️</div>
 <div class="info"><b>${v.user}</b> <span style="background:#fb923c;color:#000;font-size:10px;padding:2px 6px;border-radius:8px">${v.local}</span><div style="font-size:13px;margin-top:4px">${v.desc} ${v.musicaNome? '🎵 '+v.musicaNome:''}</div><div style="font-size:12px;opacity:.7;margin-top:4px">🎵 ${v.musicaNome||'som original'}</div></div>
 <div class="side">
 <div><button class="icon" onclick="like(this)">❤️</button><b>26,1 mil</b></div>
 <div><button class="icon" onclick="comentar()">💬</button><b>2.6k</b></div>
 <div><button class="icon">🔖</button><b>953</b></div>
 <div><button class="icon" onclick="zap()">↗️</button><b>93</b></div>
 <div><div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(45deg,#fb923c,#000);border:2px solid #fff;display:flex;align-items:center;justify-content:center">🎵</div></div>
 </div>
 </div>`).join('');
 const vs=document.querySelectorAll('.feed video');
 const ob=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.muted=!som; e.target.play().catch(()=>{}); if(som && e.target.dataset.music){}} else {e.target.pause();}})},{threshold:0.6});
 vs.forEach(x=>ob.observe(x));
}
function toggle(t){const c=t.parentElement; const v=c.querySelector('video'); const ic=c.querySelector('.center'); if(v.paused){v.play(); ic.textContent='▶️';} else {v.pause(); ic.textContent='⏸️';} ic.classList.add('show'); setTimeout(()=>ic.classList.remove('show'),600);}
function toggleSom(){som=!som; document.querySelectorAll('video').forEach(v=>v.muted=!som); document.querySelectorAll('.vol').forEach(b=>b.textContent=som?'🔊':'🔇');}
function like(b){b.textContent=b.textContent==='❤️'?'🤍':'❤️';}
function comentar(){const c=prompt('Comentário'); if(c && temProib(c)) alert('Bloqueado família');}
function zap(){const n=prompt('Whats DDD:','12'); if(n) window.open('https://wa.me/55'+n.replace(/\D/g,''));}
function nav(p){
 document.getElementById('pages').style.display='block';
 document.getElementById('pages').innerHTML=p==='amigos'?`<h2>Amigos 👥</h2><p style="opacity:.6;margin-top:10px">Em breve lista de amigos caiçaras</p><button onclick="document.getElementById('pages').style.display='none'" style="margin-top:20px;background:#222;color:#fff;border:none;padding:10px;border-radius:10px">Voltar</button>`:
 p==='msg'?`<h2>Mensagens 💬 <span style="background:red;padding:2px 8px;border-radius:10px;font-size:12px">99+</span></h2><p style="opacity:.6">DM em breve - vai pro Whats direto</p><button onclick="document.getElementById('pages').style.display='none'" style="margin-top:20px;background:#222;color:#fff;border:none;padding:10px;border-radius:10px">Voltar</button>`:
 p==='perfil'?`<h2>@Taki</h2><p>🌊 ${videos.length} vídeos - Filtro família ATIVO</p><button onclick="if(confirm('Limpar?')){localStorage.clear();location.reload();}" style="margin-top:20px;background:#331111;color:#f88;border:1px solid #522;padding:10px;border-radius:10px;width:100%">Limpar vídeos</button><button onclick="document.getElementById('pages').style.display='none'" style="margin-top:10px;background:#222;color:#fff;border:none;padding:10px;border-radius:10px;width:100%">Voltar</button>`:
 '';
 if(p==='home') document.getElementById('pages').style.display='none';
}

// EDITOR
document.getElementById('file').addEventListener('change',e=>{
 const file=e.target.files[0]; if(!file) return;
 blob=URL.createObjectURL(file);
 document.getElementById('prevVideo').src=blob;
 document.getElementById('prevVideo').play();
 document.getElementById('filters').innerHTML=filtros.map(f=>`<div class="f ${f.id===filter?'active':''}" onclick="setFilter('${f.id}')"><div style="filter:${f.css}">${f.nome}</div><span style="font-size:11px">${f.nome}</span></div>`).join('');
 document.getElementById('musics').innerHTML=musicas.map(m=>`<div class="music ${m.id===(musica?.id||'none')?'active':''}" onclick="setMusic('${m.id}')"><div><b style="font-size:13px">${m.nome}</b><div style="font-size:11px;opacity:.6">${m.autor}</div></div><div>${m.id==='none'?'':'▶️'}</div></div>`).join('');
 document.getElementById('editor').classList.add('show');
});
function setFilter(id){filter=id; const f=filtros.find(x=>x.id===id); document.getElementById('prevVideo').style.filter=f.css; document.querySelectorAll('.f').forEach((el,i)=>el.classList.toggle('active',filtros[i].id===id));}
function setMusic(id){
 const m=musicas.find(x=>x.id===id); musica=m.id==='none'?null:m;
 document.querySelectorAll('.music').forEach(el=>el.classList.remove('active')); event.currentTarget?.classList?.add('active');
 if(musica){ audioEl.src=musica.url; audioEl.loop=true; audioEl.play(); document.getElementById('prevVideo').muted=false; } else { audioEl.pause(); }
}
document.getElementById('btnPost').onclick=()=>{
 const desc=document.getElementById('leg').value||'Segue aí 🌊'; const city=document.getElementById('city').value;
 if(temProib(desc)){alert('⛔ Bloqueado - família');return;}
 const f=filtros.find(x=>x.id===filter);
 videos.unshift({user:'@Taki',local:city,desc:desc,src:blob,filter:f.css,musicaNome:musica?.nome||null});
 try{localStorage.setItem('caicara_v9',JSON.stringify(videos.map(v=>({...v,src:v.src.startsWith('blob:')?v.src:v.src}))));}catch(e){}
 document.getElementById('editor').classList.remove('show'); audioEl.pause(); renderFeed();
};

renderChips();renderFeed();
</script>
</body>
</html>
