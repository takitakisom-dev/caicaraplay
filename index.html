<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caiçara Play</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiQ2Fpw6dhcmEgUGxheSIsInNob3J0X25hbWUiOiJDYWnDp2FyYSIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwidGhlbWVfY29sb3IiOiIjZmI5MjNjIiwiYmFja2dyb3VuZF9jb2xvciI6IiMwMDAwMDAifQ==">
<meta name="theme-color" content="#fb923c">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;height:100dvh;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:30;padding:10px 12px;display:flex;gap:14px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);align-items:center}
.top button{border:none;background:none;color:#aaa;font-weight:700;font-size:15px}
.top button.active{color:#fff;border-bottom:2px solid #fff}
.liveBtn{background:#ff2d55!important;color:#fff!important;padding:5px 10px!important;border-radius:20px!important;font-size:12px!important;font-weight:900!important}
.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100dvh;width:100vw;scroll-snap-align:start;position:relative;background:#111}
.card video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.side{position:absolute;right:8px;bottom:110px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:50}
.side button{width:52px;height:52px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.side span{font-size:11px;font-weight:700}
.info{position:absolute;left:12px;right:80px;bottom:90px;z-index:40}
.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:60}
.bottom button{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;font-size:10px;opacity:.6;flex:1}
.bottom button.active{opacity:1}
.plus{width:48px;height:30px;background:#fff;color:#000;border-radius:8px;font-size:24px;font-weight:900;opacity:1!important;display:flex;align-items:center;justify-content:center}
#fileGaleria{display:none}
.modal{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
.modal.show{display:flex}
.editTop{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#000;border-bottom:1px solid #222}
.preview{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview video{width:100%;height:100%;object-fit:cover}
.filters{display:flex;gap:10px;padding:10px;overflow-x:auto;background:#0a0a0a;border-top:1px solid #222}
.f{flex:0 0 60px;text-align:center}
.f div{width:60px;height:60px;border-radius:12px;background:#222;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid transparent}
.f.active div{border-color:#fb923c}
.recBar{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;z-index:20;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);padding:16px}
.btnRec{width:74px;height:74px;border-radius:50%;background:#ff2d55;border:4px solid #fff}
.btnRec.rec{background:#fff}
.timer{font-weight:900;font-size:14px;background:rgba(0,0,0,.7);padding:6px 10px;border-radius:20px}
.grid{padding:70px 2px 80px 2px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;overflow-y:auto;height:100dvh}
.grid video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#111}
#installBanner{position:fixed;bottom:80px;left:10px;right:10px;background:#fb923c;color:#000;padding:14px;border-radius:12px;z-index:70;display:none;justify-content:space-between;align-items:center;font-weight:800}
#installBanner.show{display:flex}
.amigosList{padding:80px 12px 80px 12px;overflow-y:auto;height:100dvh}
.userRow{display:flex;align-items:center;gap:12px;padding:12px;background:#111;border-radius:12px;margin-bottom:8px;border:1px solid #222}
.userRow b{flex:1}
</style>
</head>
<body>
<input type="file" id="fileGaleria" accept="video/*">
<div class="top">
<button class="liveBtn" onclick="alert('LIVE precisa 100 seguidores')">🔴 LIVE</button>
<button class="active" id="tabForYou" onclick="showFeed()">Para você</button>
<button id="tabGaleria" onclick="showGrade()">Galeria</button>
</div>

<div class="feed" id="feed"></div>
<div class="grid" id="grid" style="display:none"></div>
<div class="amigosList" id="amigos" style="display:none">
<div style="font-weight:900;font-size:18px;margin-bottom:12px">👥 Amigos Caiçaras</div>
<div class="userRow"><div style="width:40px;height:40px;background:#fb923c;border-radius:50%;display:flex;align-items:center;justify-content:center">🏄</div><b>@Surf_Caragua<br><span style="font-size:11px;opacity:.6">Caraguatatuba</span></b><button style="background:#fb923c;border:none;color:#000;padding:6px 12px;border-radius:20px;font-weight:800" onclick="alert('Seguindo!')">Seguir</button></div>
<div class="userRow"><div style="width:40px;height:40px;background:#00f2ea;border-radius:50%;display:flex;align-items:center;justify-content:center">🐟</div><b>@Pescador_Zeca<br><span style="font-size:11px;opacity:.6">Ubatuba</span></b><button style="background:#fb923c;border:none;color:#000;padding:6px 12px;border-radius:20px;font-weight:800">Seguir</button></div>
<div class="userRow"><div style="width:40px;height:40px;background:#ff0050;border-radius:50%;display:flex;align-items:center;justify-content:center">🌊</div><b>@Taki<br><span style="font-size:11px;opacity:.6">Você - Admin</span></b><button style="background:#222;border:1px solid #444;color:#fff;padding:6px 12px;border-radius:20px">Você</button></div>
<div style="margin-top:20px;background:#111;padding:12px;border-radius:12px;border:1px solid #222">
<b>💬 Mensagens</b><div style="margin-top:8px;opacity:.7;font-size:13px">Chat em breve aqui</div>
<button style="margin-top:10px;width:100%;background:#222;color:#fff;border:none;padding:10px;border-radius:10px" onclick="window.open('https://wa.me/5512999999999')">WhatsApp</button>
</div>
</div>

<div id="installBanner">
<span>📲 Instalar Caiçara Play?</span>
<div><button onclick="instalar()" style="background:#000;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:900">Instalar</button>
<button onclick="this.parentElement.parentElement.style.display='none'" style="background:none;border:none;margin-left:8px">X</button></div>
</div>

<div class="bottom">
<button class="active" id="bInicio" onclick="showFeed()"><span style="font-size:20px">⌂</span>Início</button>
<button id="bAmigos" onclick="showAmigos()"><span style="font-size:20px">👥</span>Amigos</button>
<button onclick="abrirEscolha()" style="opacity:1"><div class="plus">+</div></button>
<button id="bGaleria" onclick="showGrade()"><span style="font-size:20px">⊞</span>Galeria</button>
<button onclick="location.href='admin.html'"><span style="font-size:20px">🛡️</span>Admin</button>
</div>

<div class="modal" id="escolha" style="background:rgba(0,0,0,.8);justify-content:flex-end;padding:16px">
<div style="background:#1e1e1e;border-radius:16px">
<button onclick="abrirGaleria()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700;border-bottom:1px solid #333">📁 Galeria (até 10 min)</button>
<button onclick="abrirCamera()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700">📷 Gravar (até 10 min)</button>
<button onclick="document.getElementById('escolha').classList.remove('show')" style="width:100%;background:none;border:none;color:#999;padding:14px">Cancelar</button>
</div>
</div>

<div class="modal" id="editor">
<div class="editTop"><button onclick="fecharEditor()" style="background:none;border:none;color:#fff;font-size:22px">✕</button><b id="editTitle">Gravar até 10 min</b><button id="btnPost" style="background:#fb923c;border:none;color:#000;padding:8px 16px;border-radius:20px;font-weight:900">Postar</button></div>
<div class="preview">
<video id="prevVideo" loop playsinline></video>
<video id="camVideo" autoplay muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none"></video>
<div class="recBar">
<button onclick="document.getElementById('fileGaleria').click()" style="background:#222;color:#fff;border:1px solid #444;padding:7px 10px;border-radius:20px">📁 Galeria</button>
<button id="btnRec" class="btnRec" onclick="toggleRec()"></button>
<div class="timer" id="timer">00:00 / 10:00</div>
<button onclick="fecharEditor()" style="background:#333;color:#fff;border:none;padding:7px 10px;border-radius:20px">Fechar</button>
</div>
</div>
<div class="filters" id="filters"></div>
<div style="padding:10px;background:#000;display:flex;gap:8px">
<input id="leg" placeholder="Legenda..." style="flex:1;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:10px">
<select id="city" style="background:#111;color:#fff;border:1px solid #333;border-radius:10px;padding:8px"><option>Caraguá</option><option>Ubatuba</option><option>São Seba</option><option>Ilhabela</option></select>
</div>
</div>

<script>
const DB_NAME='caicara_v12';let db;
function openDB(){return new Promise(res=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('videos')) db.createObjectStore('videos',{keyPath:'id',autoIncrement:true});};r.onsuccess=e=>{db=e.target.result;res();}});}
function addVideo(v){return new Promise(r=>{const tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(v).onsuccess=r;});}
function getVideos(){return new Promise(res=>{const tx=db.transaction('videos','readonly');tx.objectStore('videos').getAll().onsuccess=e=>res(e.target.result.reverse());});}
let tempBlob=null, filterCSS='none', stream=null, recorder=null, chunks=[], recTimer=null, recSec=0, isRecording=false, deferredPrompt=null;
const filtros=[{id:'none',nome:'Normal',css:'none'},{id:'bw',nome:'P&B',css:'grayscale(1)'},{id:'sepia',nome:'Retrô',css:'sepia(1)'},{id:'vivid',nome:'Vivid',css:'saturate(2) contrast(1.2)'},{id:'praia',nome:'Praia',css:'saturate(1.4) brightness(1.1)'}];

function hideAll(){document.getElementById('feed').style.display='none';document.getElementById('grid').style.display='none';document.getElementById('amigos').style.display='none';document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));document.getElementById('tabForYou').classList.remove('active');document.getElementById('tabGaleria').classList.remove('active');}
function showFeed(){hideAll();document.getElementById('feed').style.display='block';document.getElementById('bInicio').classList.add('active');document.getElementById('tabForYou').classList.add('active');render();}
function showGrade(){hideAll();document.getElementById('grid').style.display='grid';document.getElementById('bGaleria').classList.add('active');document.getElementById('tabGaleria').classList.add('active');render();}
function showAmigos(){hideAll();document.getElementById('amigos').style.display='block';document.getElementById('bAmigos').classList.add('active');}

async function curtir(btn, id){
  const tx = db.transaction('videos','readwrite');
  const store = tx.objectStore('videos');
  const req = store.get(id);
  req.onsuccess = ()=>{
    const v = req.result;
    if(!v) return;
    v.liked =!v.liked;
    if(v.liked){ v.likes = (v.likes||0)+1; } else { v.likes = Math.max(0,(v.likes||1)-1); }
    store.put(v);
    btn.innerText = v.liked? '❤️' : '🤍';
    btn.nextElementSibling.innerText = v.likes;
  };
}

function abrirEscolha(){document.getElementById('escolha').classList.add('show');}
function abrirGaleria(){document.getElementById('escolha').classList.remove('show');document.getElementById('fileGaleria').click();}
async function abrirCamera(){
 document.getElementById('escolha').classList.remove('show');
 document.getElementById('editor').classList.add('show');
 document.getElementById('camVideo').style.display='block';
 document.getElementById('prevVideo').style.display='none';
 try{
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});
  document.getElementById('camVideo').srcObject=stream;
  recorder=new MediaRecorder(stream,{mimeType:'video/webm'});chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  recorder.onstop=()=>{
   tempBlob=new Blob(chunks,{type:'video/webm'});
   document.getElementById('prevVideo').src=URL.createObjectURL(tempBlob);
   document.getElementById('prevVideo').style.display='block';
   document.getElementById('camVideo').style.display='none';
   document.getElementById('prevVideo').muted=false;
   document.getElementById('prevVideo').play();
   montar();
  };
 }catch(err){alert('Libera câmera: '+err.message);}
}
function toggleRec(){
 if(!recorder){abrirCamera();return;}
 if(!isRecording){
  chunks=[];recSec=0;isRecording=true;
  recorder.start(100);
  document.getElementById('btnRec').classList.add('rec');
  document.getElementById('editTitle').innerText='🔴 Gravando...';
  recTimer=setInterval(()=>{
    recSec++;
    const m=String(Math.floor(recSec/60)).padStart(2,'0');
    const s=String(recSec%60).padStart(2,'0');
    document.getElementById('timer').innerText=m+':'+s+' / 10:00';
    if(recSec>=600) toggleRec();
  },1000);
 }else{
  isRecording=false;recorder.stop();
  document.getElementById('btnRec').classList.remove('rec');
  document.getElementById('editTitle').innerText='Pronto! Postar';
  clearInterval(recTimer);
 }
}
document.getElementById('fileGaleria').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 tempBlob=f;
 document.getElementById('prevVideo').style.display='block';
 document.getElementById('camVideo').style.display='none';
 document.getElementById('prevVideo').src=URL.createObjectURL(f);
 document.getElementById('prevVideo').muted=false;
 document.getElementById('prevVideo').play();
 document.getElementById('editor').classList.add('show');
 montar();
});
function montar(){document.getElementById('filters').innerHTML=filtros.map(f=>`<div class="f ${f.css===filterCSS?'active':''}" onclick="setF('${f.id}')"><div style="filter:${f.css}">${f.nome}</div><div style="font-size:10px;margin-top:4px">${f.nome}</div></div>`).join('');}
function setF(id){const f=filtros.find(x=>x.id===id);filterCSS=f.css;document.getElementById('prevVideo').style.filter=f.css;document.getElementById('camVideo').style.filter=f.css;document.querySelectorAll('.f').forEach((el,i)=>el.classList.toggle('active',filtros[i].id===id));}
function fecharEditor(){
 document.getElementById('editor').classList.remove('show');
 document.getElementById('camVideo').style.display='none';
 document.getElementById('prevVideo').style.display='block';
 document.getElementById('prevVideo').pause();
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 if(recorder&&recorder.state!=='inactive') recorder.stop();
 clearInterval(recTimer);isRecording=false;
 document.getElementById('btnRec').classList.remove('rec');
 document.getElementById('timer').innerText='00:00 / 10:00';
}
async function render(){
 const vids=await getVideos();
 const feed=document.getElementById('feed');
 const grid=document.getElementById('grid');
 if(!vids.length){
   feed.innerHTML=`<div class="card" style="display:flex;align-items:center;justify-content:center;flex-direction:column"><p style="font-size:40px">🌊</p><p style="font-weight:900;margin-top:10px">Caiçara Play</p><button onclick="abrirEscolha()" style="margin-top:16px;background:#fb923c;color:#000;border:none;padding:12px 24px;border-radius:20px;font-weight:900">+ Gravar até 10 min</button></div>`;
   grid.innerHTML=`<div style="grid-column:1/4;text-align:center;padding:40px;opacity:.5">Nenhum vídeo</div>`;
   return;
 }
 feed.innerHTML=vids.map((v,i)=>`
 <div class="card">
 <video id="v${i}" loop playsinline preload="metadata" src="${URL.createObjectURL(v.blob)}" style="filter:${v.filter||'none'}" muted onclick="const vd=document.getElementById('v${i}');vd.muted=false;vd.paused?vd.play():vd.pause()"></video>
 <div class="side">
 <div style="display:flex;flex-direction:column;align-items:center"><button onclick="curtir(this, ${v.id})">${v.liked? '❤️' : '🤍'}</button><span style="font-size:11px">${v.likes||0}</span></div>
 <div style="display:flex;flex-direction:column;align-items:center"><button onclick="alert('Comentário: ${v.desc}')">💬</button><span style="font-size:11px">0</span></div>
 <div style="display:flex;flex-direction:column;align-items:center"><button onclick="alert('Link copiado!')">↗️</button><span style="font-size:11px">Share</span></div>
 </div>
 <div class="info"><b>${v.user}</b> <span style="background:#fb923c;color:#000;font-size:10px;padding:2px 6px;border-radius:8px">${v.local}</span><div style="font-size:13px;margin-top:4px">${v.desc}</div></div>
 </div>`).join('');
 grid.innerHTML=vids.map(v=>`<video src="${URL.createObjectURL(v.blob)}" muted loop playsinline onclick="this.paused?this.play():this.pause()" style="filter:${v.filter||'none'}"></video>`).join('');
}
document.getElementById('btnPost').onclick=async()=>{
 const desc=document.getElementById('leg').value||'Segue aí 🌊';const city=document.getElementById('city').value;
 if(!tempBlob){alert('Grava ou escolhe vídeo primeiro');return;}
 document.getElementById('btnPost').innerText='Salvando...';
 await addVideo({user:'@Taki',local:city,desc:desc,blob:tempBlob,filter:filterCSS,likes:0,liked:false,created:Date.now()});
 fecharEditor();tempBlob=null;document.getElementById('leg').value='';document.getElementById('btnPost').innerText='Postar';showFeed();
};
openDB().then(()=>{render();showFeed();});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBanner').classList.add('show');});
function instalar(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('installBanner').style.display='none';});}else{alert('Vai nos 3 pontinhos (⋮) > Instalar app > Instalar');}}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()))`],{type:'text/javascript'})));
}
</script>
</body>
</html>
