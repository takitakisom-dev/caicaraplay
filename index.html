<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caiçara Play</title>
<meta name="theme-color" content="#fb923c">
<link id="manifestLink" rel="manifest" href="">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#000;color:#fff;height:100dvh;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:30;padding:10px 12px;display:flex;gap:14px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);align-items:center}
.top button{border:none;background:none;color:#aaa;font-weight:700;font-size:15px}.top button.active{color:#fff;border-bottom:2px solid #fff}
.liveBtn{background:#ff2d55!important;color:#fff!important;padding:5px 10px!important;border-radius:20px!important;font-size:12px!important;font-weight:900!important}
.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}.card{height:100dvh;width:100vw;scroll-snap-align:start;position:relative;background:#111;overflow:hidden}
.card video,.card img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.side{position:absolute;right:8px;bottom:110px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:50}
.side button{width:52px;height:52px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.info{position:absolute;left:12px;right:80px;bottom:90px;z-index:40}.musicBadge{position:absolute;left:12px;bottom:155px;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:20px;font-size:11px;z-index:40}
.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:60}
.bottom button{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;font-size:10px;opacity:.6;flex:1}.bottom button.active{opacity:1}
.plus{width:48px;height:30px;background:#fff;color:#000;border-radius:8px;font-size:24px;font-weight:900;opacity:1!important;display:flex;align-items:center;justify-content:center}
#fileGaleria,#fileFoto{display:none}.modal{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}.modal.show{display:flex}
.editTop{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#000;border-bottom:1px solid #222}
.preview{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview video,.preview img{width:100%;height:100%;object-fit:cover}
.filters{display:flex;gap:10px;padding:10px;overflow-x:auto;background:#0a0a0a;border-top:1px solid #222}.f{flex:0 0 60px;text-align:center}.f div{width:60px;height:60px;border-radius:12px;background:#222;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid transparent}.f.active div{border-color:#fb923c}
.songs{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#111;border-top:1px solid #222}.song{flex:0 0 110px;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:8px}.song.active{border-color:#fb923c;background:#2a1a0a}.song b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song span{font-size:10px;opacity:.6}
.recBar{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:8px;z-index:20;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);padding:12px}.btnRec{width:68px;height:68px;border-radius:50%;background:#ff2d55;border:4px solid #fff}.btnRec.rec{background:#fff}.timer{font-weight:900;font-size:11px;background:rgba(0,0,0,.7);padding:6px 10px;border-radius:20px}
.grid{padding:70px 2px 80px 2px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;overflow-y:auto;height:100dvh}.grid video,.grid img{width:100%;aspect-ratio:9/16;object-fit:cover;background:#111}
#installBanner{position:fixed;bottom:80px;left:10px;right:10px;background:#fb923c;color:#000;padding:14px;border-radius:12px;z-index:70;display:none;justify-content:space-between;align-items:center;font-weight:800}#installBanner.show{display:flex}
</style>
</head>
<body>
<input type="file" id="fileGaleria" accept="video/*"><input type="file" id="fileFoto" accept="image/*">
<div class="top"><button class="liveBtn">🔴 LIVE</button><button class="active" id="tabForYou" onclick="showFeed()">Para você</button><button id="tabGaleria" onclick="showGrade()">Galeria</button></div>
<div class="feed" id="feed"></div><div class="grid" id="grid" style="display:none"></div>
<div id="installBanner"><span>📲 Instalar Caiçara Play?</span><div><button onclick="instalar()" style="background:#000;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:900">Instalar</button><button onclick="this.parentElement.parentElement.style.display='none'" style="background:none;border:none;margin-left:8px">X</button></div></div>
<div class="bottom"><button class="active" id="bInicio" onclick="showFeed()"><span style="font-size:20px">⌂</span>Início</button><button onclick="showFeed()"><span style="font-size:20px">👥</span>Amigos</button><button onclick="abrirEscolha()" style="opacity:1"><div class="plus">+</div></button><button id="bGaleria" onclick="showGrade()"><span style="font-size:20px">⊞</span>Galeria</button><button onclick="location.href='admin.html'"><span style="font-size:20px">🛡️</span>Admin</button></div>
<div class="modal" id="escolha" style="background:rgba(0,0,0,.8);justify-content:flex-end;padding:16px"><div style="background:#1e1e1e;border-radius:16px"><button onclick="abrirGaleria()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700;border-bottom:1px solid #333">📁 Vídeo (10 min)</button><button onclick="abrirFoto()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700;border-bottom:1px solid #333">🖼️ Foto com música</button><button onclick="abrirCamera()" style="width:100%;background:none;border:none;color:#fff;padding:18px;font-weight:700">📷 Gravar</button><button onclick="document.getElementById('escolha').classList.remove('show')" style="width:100%;background:none;border:none;color:#999;padding:14px">Cancelar</button></div></div>
<div class="modal" id="editor"><div class="editTop"><button onclick="fecharEditor()" style="background:none;border:none;color:#fff;font-size:22px">✕</button><b id="editTitle">Editar</b><button id="btnPost" style="background:#fb923c;border:none;color:#000;padding:8px 16px;border-radius:20px;font-weight:900">Postar</button></div><div class="preview"><video id="prevVideo" loop playsinline></video><img id="prevFoto" style="display:none"><video id="camVideo" autoplay muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none"></video><div class="recBar"><button onclick="document.getElementById('fileGaleria').click()" style="background:#222;color:#fff;border:1px solid #444;padding:6px 8px;border-radius:20px;font-size:12px">📁 Vídeo</button><button onclick="document.getElementById('fileFoto').click()" style="background:#222;color:#fff;border:1px solid #444;padding:6px 8px;border-radius:20px;font-size:12px">🖼️ Foto</button><button id="btnRec" class="btnRec" onclick="toggleRec()"></button><div class="timer" id="timer">00:00 / 10:00</div><button onclick="fecharEditor()" style="background:#333;color:#fff;border:none;padding:6px 8px;border-radius:20px;font-size:12px">Fechar</button></div></div><div class="filters" id="filters"></div><div class="songs" id="songs"></div><div style="padding:10px;background:#000;display:flex;gap:8px"><input id="leg" placeholder="Legenda..." style="flex:1;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:10px"><select id="city" style="background:#111;color:#fff;border:1px solid #333;border-radius:10px;padding:8px"><option>Caraguá</option><option>Ubatuba</option><option>São Seba</option><option>Ilhabela</option></select></div></div>
<script>
function createIcon(s){const c=document.createElement('canvas');c.width=s;c.height=s;const x=c.getContext('2d');x.fillStyle='#fb923c';x.beginPath();x.roundRect(0,0,s,s,s*0.2);x.fill();x.fillStyle='white';x.font=`bold ${s*0.4}px system-ui`;x.textAlign='center';x.textBaseline='middle';x.fillText('C',s/2,s/2);return c.toDataURL('image/png');}
const icon192=createIcon(192),icon512=createIcon(512);
document.getElementById('manifestLink').href=URL.createObjectURL(new Blob([JSON.stringify({name:"Caiçara Play",short_name:"CaiçaraPlay",start_url:"/",display:"standalone",background_color:"#000",theme_color:"#fb923c",icons:[{src:icon192,sizes:"192x192",type:"image/png"},{src:icon512,sizes:"512x512",type:"image/png"}]}),{type:'application/json'}));
const DB_NAME='caicara_v20';let db;function openDB(){return new Promise(r=>{const o=indexedDB.open(DB_NAME,2);o.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true});};o.onsuccess=e=>{db=e.target.result;r();}});}
function addVideo(v){return new Promise(r=>{const tx=db.transaction('videos','readwrite');tx.objectStore('videos').add(v).onsuccess=r;});}
function getVideos(){return new Promise(r=>{const tx=db.transaction('videos','readonly');tx.objectStore('videos').getAll().onsuccess=e=>r(e.target.result.reverse());});}
let tempBlob=null,tempFoto=null,filterCSS='none',stream=null,recorder=null,chunks=[],recTimer=null,recSec=0,isRecording=false,deferredPrompt=null,selectedSong='none',songAudio=null,customSongUrl=null,customSongName='Minha Música';
const filtros=[{id:'none',nome:'Normal',css:'none'},{id:'bw',nome:'P&B',css:'grayscale(1)'},{id:'sepia',nome:'Retrô',css:'sepia(1)'},{id:'vivid',nome:'Vivid',css:'saturate(2) contrast(1.2)'},{id:'praia',nome:'Praia',css:'saturate(1.4) brightness(1.1)'}];
const musicas=[
{id:'none',nome:'Sem música',artista:'Original',url:''},
{id:'mar',nome:'Mar Calmo',artista:'Lo-fi',url:'https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3'},
{id:'funk',nome:'Funk Litoral',artista:'DJ Caraguá',url:'https://cdn.pixabay.com/download/audio/2022/06/07/audio_b9bd4170e8.mp3'},
{id:'custom',nome:'📁 Minha Música',artista:'Top do momento',url:'',isCustom:true}
];
function hideAll(){document.getElementById('feed').style.display='none';document.getElementById('grid').style.display='none';document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('#feed video, #feed audio').forEach(v=>v.pause());}
function showFeed(){hideAll();document.getElementById('feed').style.display='block';document.getElementById('bInicio').classList.add('active');render();}
function showGrade(){hideAll();document.getElementById('grid').style.display='grid';document.getElementById('bGaleria').classList.add('active');render();}
async function curtir(btn,id){const tx=db.transaction('videos','readwrite');const s=tx.objectStore('videos');const r=s.get(id);r.onsuccess=()=>{const v=r.result;if(!v) return;v.liked=!v.liked;v.likes=v.liked?(v.likes||0)+1:Math.max(0,(v.likes||1)-1);s.put(v);btn.innerText=v.liked?'❤️':'🤍';btn.nextElementSibling.innerText=v.likes;};}
async function sharePost(texto){
  const shareData={title:'Caiçara Play 🌊',text:texto,url:location.href};
  if(navigator.share){try{await navigator.share(shareData);}catch(e){}}
  else{await navigator.clipboard.writeText(location.href);alert('Link copiado! 📋\n'+location.href);}
}
function abrirEscolha(){document.getElementById('escolha').classList.add('show');}
function abrirGaleria(){document.getElementById('escolha').classList.remove('show');document.getElementById('fileGaleria').click();}
function abrirFoto(){document.getElementById('escolha').classList.remove('show');document.getElementById('fileFoto').click();}
async function abrirCamera(){
 document.getElementById('escolha').classList.remove('show');document.getElementById('editor').classList.add('show');document.getElementById('camVideo').style.display='block';document.getElementById('prevVideo').style.display='none';document.getElementById('prevFoto').style.display='none';
 try{if(stream) stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});document.getElementById('camVideo').srcObject=stream;recorder=new MediaRecorder(stream,{mimeType:'video/webm'});chunks=[];recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};recorder.onstop=()=>{tempBlob=new Blob(chunks,{type:'video/webm'});tempFoto=null;document.getElementById('prevVideo').src=URL.createObjectURL(tempBlob);document.getElementById('prevVideo').style.display='block';document.getElementById('camVideo').style.display='none';document.getElementById('prevVideo').muted=false;document.getElementById('prevVideo').play();montar();};}catch(err){alert('Libera câmera');}
}
function toggleRec(){if(!recorder){abrirCamera();return;}if(!isRecording){chunks=[];recSec=0;isRecording=true;recorder.start(100);document.getElementById('btnRec').classList.add('rec');document.getElementById('editTitle').innerText='🔴 Gravando...';recTimer=setInterval(()=>{recSec++;const m=String(Math.floor(recSec/60)).padStart(2,'0');const s=String(recSec%60).padStart(2,'0');document.getElementById('timer').innerText=m+':'+s+' / 10:00';if(recSec>=600) toggleRec();},1000);}else{isRecording=false;recorder.stop();document.getElementById('btnRec').classList.remove('rec');document.getElementById('editTitle').innerText='Pronto! Postar';clearInterval(recTimer);}}
document.getElementById('fileGaleria').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;tempBlob=f;tempFoto=null;document.getElementById('prevVideo').src=URL.createObjectURL(f);document.getElementById('prevVideo').style.display='block';document.getElementById('prevFoto').style.display='none';document.getElementById('camVideo').style.display='none';document.getElementById('prevVideo').muted=false;document.getElementById('prevVideo').play();document.getElementById('editor').classList.add('show');montar();});
document.getElementById('fileFoto').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{tempFoto=ev.target.result;tempBlob=null;document.getElementById('prevFoto').src=tempFoto;document.getElementById('prevFoto').style.display='block';document.getElementById('prevVideo').style.display='none';document.getElementById('camVideo').style.display='none';document.getElementById('editor').classList.add('show');montar();document.getElementById('editTitle').innerText='Foto com música (8s)';};r.readAsDataURL(f);});
function montar(){document.getElementById('filters').innerHTML=filtros.map(f=>`<div class="f ${f.css===filterCSS?'active':''}" onclick="setF('${f.id}')"><div style="filter:${f.css}">${f.nome}</div><div style="font-size:10px;margin-top:4px">${f.nome}</div></div>`).join('');document.getElementById('songs').innerHTML=musicas.map(m=>`<div class="song ${selectedSong===m.id?'active':''}" onclick="setSong('${m.id}')"><b>${m.nome}</b><span>${m.artista}</span><div style="font-size:18px;margin-top:4px">${m.id==='none'?'🔇':m.id==='custom'?'📁':'🎵'}</div></div>`).join('');}
function setF(id){const f=filtros.find(x=>x.id===id);filterCSS=f.css;document.getElementById('prevVideo').style.filter=f.css;document.getElementById('prevFoto').style.filter=f.css;document.getElementById('camVideo').style.filter=f.css;document.querySelectorAll('.f').forEach((el,i)=>el.classList.toggle('active',filtros[i].id===id));}
function setSong(id){
 selectedSong=id;const m=musicas.find(x=>x.id===id);document.querySelectorAll('.song').forEach((el,i)=>el.classList.toggle('active',musicas[i].id===id));
 if(songAudio){songAudio.pause();songAudio=null;}
 if(id==='custom'){const inp=document.createElement('input');inp.type='file';inp.accept='audio/*';inp.onchange=e=>{const file=e.target.files[0];if(!file) return;customSongName=file.name.substring(0,18);customSongUrl=URL.createObjectURL(file);songAudio=new Audio(customSongUrl);songAudio.loop=true;songAudio.play().catch(()=>{});document.getElementById('editTitle').innerText='🎵 '+customSongName;musicas.find(x=>x.id==='custom').nome='📁 '+customSongName;montar();};inp.click();return;}
 if(m.url){songAudio=new Audio(m.url);songAudio.loop=true;songAudio.play().catch(()=>{});document.getElementById('editTitle').innerText='🎵 '+m.nome;}else{document.getElementById('editTitle').innerText='Sem música';}
}
function fecharEditor(){document.getElementById('editor').classList.remove('show');document.getElementById('camVideo').style.display='none';document.getElementById('prevVideo').pause();document.getElementById('prevFoto').style.display='none';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}if(recorder&&recorder.state!=='inactive') recorder.stop();clearInterval(recTimer);isRecording=false;document.getElementById('btnRec').classList.remove('rec');if(songAudio){songAudio.pause();songAudio=null;}selectedSong='none';filterCSS='none';}
function setupObserver(){const opt={root:document.getElementById('feed'),threshold:0.7};const obs=new IntersectionObserver(es=>{es.forEach(en=>{const card=en.target;const v=card.querySelector('video');const a=card.querySelector('audio');if(en.isIntersecting){document.querySelectorAll('#feed video, #feed audio').forEach(x=>{if(x!==v&&x!==a) x.pause();});if(v){v.muted=false;v.play().catch(()=>{});}if(a){a.play().catch(()=>{});} }else{if(v) v.pause();if(a) a.pause();}});},opt);document.querySelectorAll('.card').forEach(c=>obs.observe(c));}
async function render(){
 const vids=await getVideos();const feed=document.getElementById('feed');const grid=document.getElementById('grid');
 if(!vids.length){feed.innerHTML=`<div class="card" style="display:flex;align-items:center;justify-content:center;flex-direction:column"><p style="font-size:40px">🌊</p><p style="font-weight:900;margin-top:10px">Caiçara Play</p><button onclick="abrirEscolha()" style="margin-top:16px;background:#fb923c;color:#000;border:none;padding:12px 24px;border-radius:20px;font-weight:900">+ Postar</button></div>`;return;}
 feed.innerHTML=vids.map(v=>{const isFoto=v.type==='foto';const media=isFoto?`<img src="${v.fotoData}" style="filter:${v.filter||'none'}">`:`<video loop playsinline src="${URL.createObjectURL(v.blob)}" style="filter:${v.filter||'none'}" muted></video>`;const badge=v.songNome?`<div class="musicBadge">🎵 ${v.songNome}</div>`:'';const audio=v.songUrl?`<audio loop src="${v.songUrl}"></audio>`:'';return `<div class="card">${media}${audio}${badge}<div class="side"><div style="display:flex;flex-direction:column;align-items:center"><button onclick="curtir(this,${v.id})">${v.liked?'❤️':'🤍'}</button><span style="font-size:11px">${v.likes||0}</span></div><div style="display:flex;flex-direction:column;align-items:center"><button onclick="alert('${v.desc}')">💬</button><span>0</span></div><div style="display:flex;flex-direction:column;align-items:center"><button onclick="sharePost('${(v.desc||'').replace(/'/g,'')}')">↗️</button><span>Share</span></div></div><div class="info"><b>${v.user}</b> <span style="background:#fb923c;color:#000;font-size:10px;padding:2px 6px;border-radius:8px">${v.local}</span><div style="font-size:13px;margin-top:4px">${v.desc}</div></div></div>`;}).join('');
 grid.innerHTML=vids.map(v=>v.type==='foto'?`<img src="${v.fotoData}">`:`<video src="${URL.createObjectURL(v.blob)}" muted loop></video>`).join('');
 setTimeout(setupObserver,300);
}
document.getElementById('btnPost').onclick=async()=>{
 const desc=document.getElementById('leg').value||'Segue aí 🌊';const city=document.getElementById('city').value;
 if(!tempBlob&&!tempFoto){alert('Escolhe vídeo ou foto');return;}
 const song=musicas.find(m=>m.id===selectedSong);
 const finalSongUrl=(song&&song.id==='custom')?customSongUrl:(song?song.url:'');
 const finalSongNome=(song&&song.id==='custom')?customSongName:(song?song.nome:'');
 document.getElementById('btnPost').innerText='Salvando...';
 if(tempFoto){await addVideo({user:'@Taki',local:city,desc:desc,type:'foto',fotoData:tempFoto,blob:null,filter:filterCSS,songNome:finalSongNome,songUrl:finalSongUrl,likes:0,liked:false});}
 else{await addVideo({user:'@Taki',local:city,desc:desc,type:'video',blob:tempBlob,fotoData:null,filter:filterCSS,songNome:finalSongNome,songUrl:finalSongUrl,likes:0,liked:false});}
 fecharEditor();tempBlob=null;tempFoto=null;customSongUrl=null;document.getElementById('leg').value='';document.getElementById('btnPost').innerText='Postar';showFeed();
};
openDB().then(()=>{render();showFeed();});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;setTimeout(()=>document.getElementById('installBanner').classList.add('show'),2000);});
function instalar(){if(deferredPrompt){deferredPrompt.prompt();}}
if('serviceWorker' in navigator){const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));`;navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))); }
</script>
</body>
</html>
